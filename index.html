    if(b.t==="cards") b.cards.forEach((c,i)=> m["c_"+b.uid+"_"+i] = stripTags(c.f.replace(/^\S+\s/,""))+". "+stripTags(c.b));
    if(b.t==="passage" && !b.ref) m["p_"+b.id] = b.title+". "+cleanText(b.text);
    if(b.t==="steps") b.steps.forEach((s,i)=> m["s_"+b.id+"_"+i] = "Step "+(i+1)+". "+s.s);
    if(b.t==="sort") m["o_"+b.id] = b.prompt+" The choices are: "+b.cats.join(", ")+". "+b.items.map((it,i)=>(i+1)+". "+it.x).join(" ");
    if(b.t==="q"){
      if(b.type==="ab"){ m["q_"+b.id+"_a"]=b.a.stem+" "+ch(b.a.choices); m["q_"+b.id+"_b"]=b.b.stem+" "+ch(b.b.choices); }
      else m["q_"+b.id] = (b.mini? b.mini+" ":"")+b.stem+" "+ch(b.choices);
    }
  }));
  return m;
}

</script>
<script>
// ================== SETTINGS ==================
const N = 6;
const QUEST = "quest"==="quest";
const CONFIG = {
  teacherPin:"1234", practiceLink:"quest/",
  // LIVE CLASS (Supabase) — paste your Project URL and anon public key. Leave blank for self-paced mode.
  supabaseUrl:"https://qwkxiatwxipgjsorwqow.supabase.co", supabaseKey:"sb_publishable_UBhKCRspmtWDGs3Jv_8i4A_lOlXBJMC"
};
const LOGO_SRC = "/*__LOGO__*/";
// ==============================================
const L = prepLesson((QUEST?QUESTS:LESSONS)[N]);
const SPEECH = lessonSpeech(L);
const TEACH = /[?&]teach/.test(location.search);
const KEYMODE = /[?&]key/.test(location.search);
const STORE = (QUEST?"pm2quest_d":"pm2lesson_d")+N;
let S = load();
function load(){ try{ const j=JSON.parse(localStorage.getItem(STORE)); if(j&&j.ans) return j; }catch(e){}
  let nm=""; for(const k of ["pm2lesson_d"+N,"pm2hub_v1"]){ try{ const h=JSON.parse(localStorage.getItem(k)); if(h&&h.name&&!nm) nm=h.name; }catch(e){} }
  return {name:nm, ans:{}, steps:{}, flips:{}, sorts:{}}; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
const $=s=>document.querySelector(s), app=$("#app");
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const LT=i=>"ABCDEFGH"[i];
const fmt=n=>Number.isInteger(n)?n:(Math.round(n*10)/10);
const DOKN={1:"DOK 1 · Recall",2:"DOK 2 · Skill & Concept",3:"DOK 3 · Strategic Thinking"};

// header
(function(){
  const box=$("#logoBox");
  box.innerHTML = (LOGO_SRC && !LOGO_SRC.startsWith("/*")) ? `<img src="${LOGO_SRC}" alt="The Literacy Locksmith logo">` : `<div class="txt">🗝️ The Literacy Locksmith</div>`;
  $("#htitle").textContent = QUEST ? `Day ${L.n} Independent Quest: ${L.title}` : `Day ${L.n} Follow-Along: ${L.title}`;
  $("#hsub").textContent = QUEST ? `${L.date} · Unlock all 4 rooms on your own. Earn a key in every room!` : `${L.date} · Learn it together, then do your Day ${L.n} practice!`;
  if(QUEST) $("#tmin").textContent = "40";
  document.title = (QUEST?`Day ${L.n} Quest: `:`Day ${L.n} Follow-Along: `)+L.title;
})();

// ---------- audio ----------
let curA=null, curB=null;
function stopAudio(){ if(curA){curA.pause();curA=null;} try{speechSynthesis.cancel();}catch(e){} if(curB){curB.classList.remove("playing");curB.textContent="🔊 Listen";curB=null;} }
function voice(){ const v=speechSynthesis.getVoices(); return v.find(x=>x.name==="Google US English")||v.find(x=>x.lang==="en-US")||v[0]; }
function listen(btn,key,ev){ if(ev) ev.stopPropagation();
  if(curB===btn){stopAudio();return;} stopAudio(); curB=btn; btn.classList.add("playing"); btn.textContent="⏹ Stop";
  const a=new Audio("audio/"+key+".mp3"); curA=a; a.onended=stopAudio;
  a.onerror=()=>{ if(curA!==a) return; curA=null; const u=new SpeechSynthesisUtterance(SPEECH[key]||""); const v=voice(); if(v) u.voice=v; u.rate=.95; u.onend=stopAudio; speechSynthesis.speak(u); };
  a.play().catch(()=>a.onerror()); }
const lb=k=>`<button class="listen" onclick="listen(this,'${k}',event)">🔊 Listen</button>`;

// ---------- progress ----------
function blockDone(b){
  if(b.t==="q") return !!(S.ans[b.id]&&S.ans[b.id].done);
  if(b.t==="sort") return !!(S.sorts[b.id]&&S.sorts[b.id].done);
  if(b.t==="steps") return stepN(b)>=b.steps.length;
  return true;
}
const secDone = sec => sec.blocks.every(blockDone);
function unlocked(i){ if(TEACH) return true; if(liveOn()) return i<=live.pace; if(liveWaiting()) return false; for(let k=0;k<i;k++) if(!secDone(L.sections[k])) return false; return true; }
function scored(){ const r=[]; L.sections.forEach(s=>s.blocks.forEach(b=>{ if(b.t==="q"||b.t==="sort") r.push(b); })); return r; }
function pts(b){ if(b.t==="q"){const a=S.ans[b.id]; return a&&a.done?a.pts:0;} const s=S.sorts[b.id]; return s&&s.done?s.pts:0; }
function totals(){ const all=scored(); let p=0,d=0; all.forEach(b=>{ p+=pts(b); if(blockDone(b)) d++; }); return {p, n:all.length, d}; }

function nav(){
  const cur = L.sections.findIndex((s,i)=>!secDone(s));
  const t=totals();
  $("#nav").innerHTML = L.sections.map((s,i)=>{ const done=secDone(s), un=unlocked(i);
    const cls = done?"done":(i===cur?"now":(un?"":"lock"));
    return `<button class="${cls}" onclick="jump(${i})">${done?"✅":(un?s.icon:"🔒")} ${s.title}</button>`; }).join("")
    + `<span class="sc">⭐ ${fmt(t.p)}/${t.n}</span>` + livePill();
  liveTrack();
}
function jump(i){ const el=document.getElementById("sec"+i); if(el) el.scrollIntoView({behavior:"smooth"}); }

// ---------- render ----------
function render(){
  if(KEYMODE) return teacherKey();
  if(!S.name) return welcome();
  let h = `<div class="card goal"><div class="big">🎯</div><div style="flex:1;min-width:240px">
    <h2 style="margin:0 0 4px">${QUEST?"🗺️ Your Mission":"Learning Goal"}</h2><div style="font-size:19px">${esc(L.goal)}</div>
    <div class="chips">${L.stds.map(s=>`<span class="std">${esc(s)}</span>`).join("")}</div>
    <div class="chips"><span class="dok dok1">DOK 1 · Recall</span><span class="dok dok2">DOK 2 · Skill & Concept</span><span class="dok dok3">DOK 3 · Strategic Thinking</span></div>
    <p class="muted" style="margin:8px 0 0;font-size:15px;color:var(--muted)">👋 ${esc(S.name)} · ${QUEST ? "Finish each room to unlock the next one. Earn 🥇 Gold (80%+), 🥈 Silver (60%+), or 🥉 Bronze in every room." : (LIVE&&!TEACH ? "Mrs. Rees will open each part as she teaches. Finish every checkpoint!" : "Answer every checkpoint to unlock the next part.")} One try per question!</p></div></div>`;
  L.sections.forEach((s,i)=> h += `<section class="sec" id="sec${i}"></section>`);
  app.innerHTML = h;
  L.sections.forEach((s,i)=>renderSec(i));
  nav(); sizePen();
}
function renderSec(i){
  const sec=L.sections[i], el=document.getElementById("sec"+i);
  el.dataset.locked = unlocked(i) ? "0" : "1";
  if(!unlocked(i)){ el.innerHTML = `<div class="card locked"><div class="ic">🔒</div><h3 style="margin:4px 0">${sec.icon} ${sec.title}</h3>${liveOn()||liveWaiting() ? (i===0 && live.pace<0 ? "⏳ Mrs. Rees will open the Warm-Up when class begins." : "⏳ Wait for Mrs. Rees to open this part.") : "Finish the part above to unlock this."}</div>`; return; }
  let h = `<div class="card"><div class="sechead"><span class="ic">${sec.icon}</span><h2>${sec.title}</h2><span class="mins">⏱ ${sec.min} min</span></div>`;
  if(TEACH && sec.notes) h += `<div class="notes"><b>🍎 Teacher Talk:</b> ${sec.notes.map(esc).join(" ")}</div>`;
  sec.blocks.forEach(b=> h += `<div class="blk" id="b_${b.uid}">${blockHTML(b)}</div>`);
  if(secDone(sec)) h += sec.exit ? (QUEST? keyBanner(sec)+shotHTML() : shotHTML()) : (QUEST ? keyBanner(sec)+`<div class="secdone">🔓 Next room unlocked! Scroll down. ⬇️</div>` : `<div class="secdone">✅ ${sec.title} complete! Scroll down for the next part. ⬇️</div>`);
  h += `</div>`;
  el.innerHTML = h;
}
function refresh(i){
  renderSec(i);
  L.sections.forEach((s,k)=>{ const el=document.getElementById("sec"+k); if(k!==i && (el.dataset.locked==="1") === unlocked(k)) renderSec(k); });
  nav(); sizePen();
}
function secOf(b){ return L.sections.findIndex(s=>s.blocks.includes(b)); }
function findBlock(uid){ for(const s of L.sections) for(const b of s.blocks) if(b.uid===uid) return b; }

function passageBody(p){
  const lit = new Set(); // highlights currently on
  L.sections.forEach(s=>s.blocks.forEach(b=>{ if(b.t==="steps"){ const n=stepN(b); b.steps.slice(0,n).forEach((st,k)=>{ if(k===n-1&&st.hl) st.hl.forEach(x=>lit.add(x)); }); }}));
  const mk = t => esc(t).replace(/\{\{(\w+)\|([^}]*)\}\}/g,(m,k,x)=>`<mark class="hl ${lit.has(k)?"on":""}" data-k="${k}">${x}</mark>`);
  if(p.poem) return p.text.split(/\n\s*\n/).map(st=>`<div class="poem">${mk(st)}</div>`).join("");
  let n=0;
  return p.text.split(/\n\s*\n/).map(par=>{
    if(par.startsWith("## ")){ const [hh,...rest]=par.split("\n"); let o=`<h4>${esc(hh.slice(3))}</h4>`; if(rest.length){n++;o+=`<div class="p"><span class="pn">${n}</span><div>${mk(rest.join(" "))}</div></div>`;} return o; }
    n++; return `<div class="p"><span class="pn">${n}</span><div>${mk(par)}</div></div>`; }).join("");
}
function blockHTML(b){
  if(b.t==="text") return `<div class="txt"><div>${b.html}</div>${lb("t_"+b.uid)}</div>`;
  if(b.t==="cards") return `<div class="cards">${b.cards.map((c,k)=>{ const on=S.flips[b.uid+"_"+k];
      return `<div class="flip ${on?"on":""}" role="button" tabindex="0" onclick="flip('${b.uid}',${k},this)"><div class="inr"><div class="f">${c.f}<small>👆 Tap to flip</small></div><div class="b"><div>${c.b}</div><span class="lb">${lb("c_"+b.uid+"_"+k)}</span></div></div></div>`; }).join("")}</div>
      <p class="fliphint">👆 Tap a card to flip it. Tap again to flip it back.</p>`;
  if(b.t==="passage"){
    if(b.ref){ const p=L.P[b.ref]; return `<details class="reread"><summary>📖 Reread: ${esc(p.title)}</summary><div class="pass"><div class="ph"><span></span>${lb("p_"+p.id)}</div>${passageBody(p)}</div></details>`; }
    return `<div class="pass"><div class="ph"><h3>${esc(b.title)}</h3>${lb("p_"+b.id)}</div>${passageBody(b)}</div>`;
  }
  if(b.t==="steps"){ const n=stepN(b); const studentLive = liveOn() && !TEACH;
    return `<div class="steps"><h4>🧠 Think-Aloud: ${esc(b.title)}</h4>${b.steps.slice(0,n).map((s,k)=>`<div class="step"><span class="num">${k+1}</span><div style="flex:1">${esc(s.s)}</div>${lb("s_"+b.id+"_"+k)}</div>`).join("")}
      ${n<b.steps.length?(studentLive?`<div class="livewait">👀 Watch Mrs. Rees — the steps will appear here as she teaches. (${n}/${b.steps.length})</div>`:`<div class="act" style="justify-content:flex-start"><button class="btn gold" onclick="nextStep('${b.uid}')">${n===0?"▶ Start the think-aloud":"Next step ▶"} (${n}/${b.steps.length})</button></div>`):`<div class="secdone" style="margin-top:6px">🔓 Model complete!</div>`}</div>`; }
  if(b.t==="sort") return sortHTML(b);
  if(b.t==="q") return qHTML(b);
  return "";
}
function flip(uid,k,el){ const key=uid+"_"+k; S.flips[key]=!S.flips[key]; save(); el.classList.toggle("on"); }
function nextStep(uid){ const b=findBlock(uid); if(liveOn() && !TEACH) return; S.steps[b.id]=(S.steps[b.id]||0)+1; save(); stopAudio();
  if(TEACH) livePushSteps();
  // update highlights in all passages of this section and re-render
  refresh(secOf(b));
  const n=stepN(b), st=b.steps[n-1];
  if(st&&st.hl){ const m=document.querySelector(`mark.hl.on[data-k="${st.hl[0]}"]`); if(m) m.scrollIntoView({behavior:"smooth",block:"center"}); }
  else { const e=document.getElementById("b_"+uid); if(e) e.scrollIntoView({behavior:"smooth",block:"end"}); }
}

// ---------- sort ----------
function sortHTML(b){
  const s = S.sorts[b.id] = S.sorts[b.id] || {sel:{}, done:false};
  const rows = b.items.map((it,k)=>{ const v=s.sel[k]; let cls="sortrow"; if(s.done) cls+= v===it.c?" right":" wrong";
    return `<div class="${cls}"><div class="it">${s.done?(v===it.c?"✅ ":"❌ "):""}${k+1}. ${esc(it.x)}</div><div class="opts">${b.cats.map((c,ci)=>{
      let bc = v===ci?"sel":""; if(s.done){ bc = ci===it.c ? "ans" : (v===ci?"bad":""); }
      return `<button class="${bc}" ${s.done?"disabled":""} onclick="pickSort('${b.uid}',${k},${ci})">${esc(c)}</button>`; }).join("")}</div></div>`; }).join("");
  const ready = Object.keys(s.sel).length===b.items.length;
  let h = `<div class="q"><div class="qmeta"><span class="dok dok${b.dok}">${DOKN[b.dok]}</span><span class="typ">Sort</span></div>
    <div class="stemrow"><div class="stem">${esc(b.prompt)}</div>${lb("o_"+b.id)}</div>${rows}`;
  if(s.done){ const c=b.items.filter((it,k)=>s.sel[k]===it.c).length; const cls=c===b.items.length?"ok":(c/b.items.length>=.6?"half":"no");
    h += `<div class="fb ${cls}"><h4>${c===b.items.length?"🎉 Perfect sort!":"🗝️ "+c+" of "+b.items.length+" correct"}</h4><b>Key Tip:</b> ${esc(b.why)}</div>`; }
  else h += `<div class="act"><button class="btn" ${ready?"":"disabled"} onclick="checkSort('${b.uid}')">✅ Check my sort</button></div>`;
  return h+`</div>`;
}
function pickSort(uid,k,ci){ const b=findBlock(uid); S.sorts[b.id].sel[k]=ci; save(); document.getElementById("b_"+uid).innerHTML=sortHTML(b); }
function checkSort(uid){ const b=findBlock(uid); const s=S.sorts[b.id]; const c=b.items.filter((it,k)=>s.sel[k]===it.c).length;
  s.pts=c/b.items.length; s.done=true; save(); if(c===b.items.length) burst(40,false); refresh(secOf(b)); }

// ---------- questions ----------
function qHTML(b){
  const a = S.ans[b.id] = S.ans[b.id] || {sel: b.type==="multi"?[]:(b.type==="ab"?{a:null,b:null}:null), done:false};
  const done=a.done;
  const btns=(choices,isSel,cls,fn,isRight)=>choices.map((c,i)=>{ let k="ch "+cls; if(isSel(i)) k+=" sel"; if(done){ if(isRight(i)) k+=" right"; else if(isSel(i)) k+=" wrong"; }
    return `<button class="${k}" ${done?"disabled":""} onclick="${fn}('${b.uid}',${i})"><span class="lt">${LT(i)}</span><span>${esc(c)}</span></button>`; }).join("");
  let h = `<div class="q"><div class="qmeta"><span class="dok dok${b.dok}">${DOKN[b.dok]}</span>${b.type==="ab"?'<span class="typ">Part A / Part B</span>':""}${b.type==="multi"?`<span class="typ">Select ${b.pick}</span>`:""}</div>`;
  if(b.mini) h += `<div class="mini">${esc(b.mini)}</div>`;
  if(b.type==="mc") h += `<div class="stemrow"><div class="stem">${esc(b.stem)}</div>${lb("q_"+b.id)}</div><div class="choices">${btns(b.choices,i=>a.sel===i,"","pMC",i=>i===b.answer)}</div>`;
  else if(b.type==="multi") h += `<div class="stemrow"><div class="stem">${esc(b.stem)}</div>${lb("q_"+b.id)}</div><p class="howto">☑️ Choose exactly ${b.pick}. Test each choice: true or false?</p><div class="choices">${btns(b.choices,i=>a.sel.includes(i),"multi","pMulti",i=>b.answer.includes(i))}</div>`;
  else h += `<p class="howto">🅰️ Answer Part A first. Then 🅱️ pick the evidence that PROVES it.</p>
    <div class="part first"><div class="stemrow"><div class="stem">${esc(b.a.stem)}</div>${lb("q_"+b.id+"_a")}</div><div class="choices">${btns(b.a.choices,i=>a.sel.a===i,"","pA",i=>i===b.a.answer)}</div></div>
    <div class="part"><div class="stemrow"><div class="stem">${esc(b.b.stem)}</div>${lb("q_"+b.id+"_b")}</div><div class="choices">${btns(b.b.choices,i=>a.sel.b===i,"","pB",i=>i===b.b.answer)}</div></div>`;
  if(done){ const cls=a.pts===1?"ok":(a.pts>0?"half":"no");
    const hd = a.pts===1?"🎉 You got it!":(a.pts>0?"🔓 Part A is right — Part B needed the proof.":"💡 Not this time — here's the key:");
    h += `<div class="fb ${cls}"><h4>${hd}</h4><b>🗝️ Why:</b> ${esc(b.why)}</div>`; }
  else { const ready = b.type==="mc"?a.sel!=null:(b.type==="multi"?a.sel.length===b.pick:(a.sel.a!=null&&a.sel.b!=null));
    h += `<div class="act"><button class="btn" ${ready?"":"disabled"} onclick="checkQ('${b.uid}')">✅ Check my answer</button></div>`; }
  return h+`</div>`;
}
function redrawQ(b){ document.getElementById("b_"+b.uid).innerHTML=qHTML(b); }
function pMC(u,i){ const b=findBlock(u); S.ans[b.id].sel=i; save(); redrawQ(b); }
function pMulti(u,i){ const b=findBlock(u); const s=S.ans[b.id].sel; const k=s.indexOf(i); if(k>=0) s.splice(k,1); else { if(s.length>=b.pick) s.shift(); s.push(i);} save(); redrawQ(b); }
function pA(u,i){ const b=findBlock(u); S.ans[b.id].sel.a=i; save(); redrawQ(b); }
function pB(u,i){ const b=findBlock(u); S.ans[b.id].sel.b=i; save(); redrawQ(b); }
function score(b,sel){ if(b.type==="mc") return sel===b.answer?1:0;
  if(b.type==="multi") return [...b.answer].sort().join()===[...sel].sort().join()?1:0;
  const A=sel.a===b.a.answer, B=sel.b===b.b.answer; return A&&B?1:(A?.5:0); }
function checkQ(u){ const b=findBlock(u); const a=S.ans[b.id]; a.pts=score(b,a.sel); a.done=true; stopAudio();
  const si=secOf(b), sec=L.sections[si];
  if(sec.exit && secDone(sec) && !S.doneAt){ S.doneAt=Date.now(); save(); refresh(si); bigConfetti(); const e=document.querySelector(".shot"); if(e) e.scrollIntoView({behavior:"smooth",block:"center"}); return; }
  save(); if(a.pts===1) burst(40,false);
  const wasDone = secDone(sec); refresh(si);
  const e=document.getElementById("b_"+u); if(e){ const fb=e.querySelector(".fb"); if(fb) fb.scrollIntoView({behavior:"smooth",block:"center"}); }
}

// ---------- screenshot box ----------
function secPct(sec){ let p=0,n=0; sec.blocks.forEach(b=>{ if(b.t==="q"||b.t==="sort"){ p+=pts(b); n++; } }); return n? p/n : 0; }
function keyOf(sec){ const x=secPct(sec); return x>=.8?{e:"🥇",t:"Gold Key"}:(x>=.6?{e:"🥈",t:"Silver Key"}:{e:"🥉",t:"Bronze Key"}); }
function keyBanner(sec){ const k=keyOf(sec); let p=0,n=0; sec.blocks.forEach(b=>{ if(b.t==="q"||b.t==="sort"){ p+=pts(b); n++; } });
  return `<div class="keyban"><span>${k.e}</span><div><b>${k.t} earned!</b><br>${fmt(p)} of ${n} in ${esc(sec.title.replace(/^Room \d+: /,""))}</div></div>`; }
function questShot(){
  if(!S.doneAt){ S.doneAt=Date.now(); save(); }
  const t=totals(); const keys=L.sections.map(s=>keyOf(s).e).join(" ");
  const mins = S.t0 ? Math.max(1,Math.round((S.doneAt-S.t0)/60000)) : null;
  const when = new Date(S.doneAt).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  const pct=t.p/t.n;
  return `<div style="text-align:center;margin-top:10px"><div style="font-size:50px">${pct>=.8?"🏆":(pct>=.6?"🌟":"💪")}</div>
    <h2 style="margin:4px 0">${pct>=.8?"Quest complete — Master Locksmith!":(pct>=.6?"Quest complete — so close!":"Quest complete — great effort!")}</h2></div>
    <div class="shot"><div class="shotT">📸 Take a screenshot of this box and turn it in on Canvas!</div>
    <div class="shotG">
      <div><span>👤 Name</span><b>${esc(S.name)}</b></div>
      <div><span>⭐ Quest Score</span><b>${fmt(t.p)}/${t.n}</b></div>
      <div><span>🔑 Keys Earned</span><b>${keys}</b></div>
      <div><span>⏱️ Time Working</span><b>${mins?mins+" min":"—"}</b></div>
      <div style="grid-column:span 2"><span>📅 Finished</span><b>${when}</b></div>
    </div>
    <div class="shotR">Day ${L.n} Independent Quest: ${esc(L.title)}</div>
    <div class="shotH">📱 iPad screenshot: press the <b>top button</b> + <b>volume up</b> at the same time. Make sure your <b>name</b>, <b>score</b>, and <b>time</b> show!</div></div>
    <div class="secdone" style="margin-top:12px">⭐ Finished early? Open your <b>PM2 Countdown Review</b> and do your Day ${L.n} practice.</div>`;
}
function shotHTML(){ if(QUEST) return questShot();
  if(!S.doneAt){ S.doneAt=Date.now(); save(); }
  const t=totals(); const exit=L.sections.find(s=>s.exit); let ep=0; exit.blocks.forEach(b=>{ if(b.t==="q") ep+=pts(b); });
  const ckp = L.sections.filter(secDone).length;
  const when = new Date(S.doneAt).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  const pct=t.p/t.n;
  return `<div style="text-align:center;margin-top:10px"><div style="font-size:50px">${pct>=.8?"🏆":(pct>=.6?"🌟":"💪")}</div>
    <h2 style="margin:4px 0">${pct>=.8?"Key Master! Lesson complete!":(pct>=.6?"Lesson complete — so close!":"Lesson complete — great effort!")}</h2></div>
    <div class="shot"><div class="shotT">📸 Take a screenshot of this box and turn it in on Canvas!</div>
    <div class="shotG">
      <div><span>👤 Name</span><b>${esc(S.name)}</b></div>
      <div><span>⭐ Lesson Score</span><b>${fmt(t.p)}/${t.n}</b></div>
      <div><span>🔑 Exit Key</span><b>${fmt(ep)}/${exit.blocks.length}</b></div>
      <div><span>✅ Checkpoints</span><b>${ckp}/${L.sections.length}</b></div>
      <div style="grid-column:span 2"><span>📅 Finished</span><b>${when}</b></div>
    </div>
    <div class="shotR">Day ${L.n} Follow-Along: ${esc(L.title)}</div>
    <div class="shotH">📱 iPad screenshot: press the <b>top button</b> + <b>volume up</b> at the same time. Make sure your <b>name</b>, <b>score</b>, and <b>time</b> show!</div></div>
    <div style="text-align:center;margin-top:14px"><a class="btn gold" style="text-decoration:none;display:inline-block" href="${CONFIG.practiceLink}">🗺️ Start your Day ${L.n} Independent Quest ▶</a></div>`;
}

// ---------- welcome ----------
function welcome(){
  app.innerHTML = `<div class="card welcome"><div style="font-size:60px">🗝️</div><h2 style="font-size:28px;margin:6px 0">${QUEST?`Day ${L.n} Independent Quest`:`Day ${L.n} Follow-Along`}</h2>
    <p>${QUEST?"Work on your own to unlock 4 rooms. Earn a key in every room! 🔑":"Follow along as Mrs. Rees teaches. Answer each checkpoint to unlock the next part!"}</p>
    <label for="nm"><b>Type your first name and last initial:</b></label>
    <input id="nm" maxlength="30" placeholder="Example: Maya R." autocomplete="off">
    <button class="btn gold" onclick="setName()">Let's go! 🚀</button></div>`;
  $("#nm").addEventListener("keydown",e=>{ if(e.key==="Enter") setName(); });
  nav();
}
function setName(){ const v=$("#nm").value.trim(); if(!v) return; S.name=v; if(!S.t0) S.t0=Date.now(); save(); render(); }

// ---------- teacher key ----------
function teacherKey(){
  if(sessionStorage.getItem("pm2key")!=="ok"){ const p=prompt("Teacher PIN:"); if(p!==CONFIG.teacherPin){ app.innerHTML=`<div class="card">🔒 Locked. <a href="./">Student page</a></div>`; return; } try{sessionStorage.setItem("pm2key","ok");}catch(e){} }
  const opt=(arr,ans)=>arr.map((c,i)=>{ const ok=Array.isArray(ans)?ans.includes(i):ans===i; return `<div class="${ok?"ans":""}">${LT(i)}. ${esc(c)} ${ok?"✔":""}</div>`; }).join("");
  let h=`<div class="card"><h2 style="margin-top:0">🗝️ Teacher Key — Day ${L.n}: ${esc(L.title)}</h2>
    <p><b>Teach mode:</b> add <code>?teach</code> to the link to see Teacher Talk notes, unlock every section, and use the ✏️ pen to circle on screen.</p>
    <p>Scoring: 1 point per question (Part A/B: ½ point if only Part A is right; select-two is all-or-nothing). Each sort counts as 1 point (partial credit for each item sorted correctly).</p>
    <button class="btn sm ghost" onclick="if(confirm('Erase saved work for this lesson on this iPad?')){localStorage.removeItem('${STORE}');alert('Cleared.');}">🧹 Reset this lesson on this iPad</button> <button class="btn sm" onclick="print()">🖨️ Print</button></div>`;
  L.sections.forEach(sec=>{ h+=`<div class="card"><h2>${sec.icon} ${sec.title} (${sec.min} min)</h2><div class="notes"><b>🍎 Teacher Talk:</b> ${sec.notes.map(esc).join(" ")}</div>`;
    sec.blocks.forEach(b=>{
      if(b.t==="q"){ let body=b.mini?`<div class="mini">${esc(b.mini)}</div>`:""; body+= b.type==="ab" ? `<b>${esc(b.a.stem)}</b>${opt(b.a.choices,b.a.answer)}<br><b>${esc(b.b.stem)}</b>${opt(b.b.choices,b.b.answer)}` : `<b>${esc(b.stem)}</b>${opt(b.choices,b.answer)}`;
        h+=`<div class="keyq"><span class="dok dok${b.dok}">${DOKN[b.dok]}</span> ${body}<div style="font-size:15px;color:var(--muted)">Why: ${esc(b.why)}</div></div>`; }
      if(b.t==="sort") h+=`<div class="keyq"><span class="dok dok${b.dok}">${DOKN[b.dok]}</span> <b>${esc(b.prompt)}</b>${b.items.map(it=>`<div>${esc(it.x)} → <span class="ans">${esc(b.cats[it.c])}</span></div>`).join("")}</div>`;
      if(b.t==="steps") h+=`<div class="keyq"><b>Think-aloud: ${esc(b.title)}</b><ol>${b.steps.map(s=>`<li>${esc(s.s)}</li>`).join("")}</ol></div>`;
      if(b.t==="passage"&&!b.ref) h+=`<div class="keyq"><b>📖 Passage: ${esc(b.title)}</b></div>`;
    }); h+=`</div>`; });
  app.innerHTML=h; $("nav.track").style.display="none";
}

// ---------- teacher pen ----------
const pen=$("#pen"), pctx=pen.getContext("2d"); let penOn=false, penColor="rgba(220,38,38,.9)", penW=4, drawing=false, last=null;
function sizePen(){ if(!TEACH) return; const w=document.documentElement.scrollWidth, h=document.documentElement.scrollHeight;
  if(pen.width===w && pen.height===h) return; const tmp=document.createElement("canvas"); tmp.width=pen.width; tmp.height=pen.height; tmp.getContext("2d").drawImage(pen,0,0);
  pen.width=w; pen.height=h; pen.style.width=w+"px"; pen.style.height=h+"px"; pctx.drawImage(tmp,0,0); }
if(TEACH){
  const bar=document.createElement("div"); bar.id="penbar";
  bar.innerHTML=`<button id="pt" title="Pen on/off">✏️</button><button data-c="rgba(220,38,38,.9)" data-w="4"><span class="sw" style="background:#dc2626"></span></button><button data-c="rgba(37,99,235,.9)" data-w="4"><span class="sw" style="background:#2563eb"></span></button><button data-c="rgba(250,204,21,.45)" data-w="18"><span class="sw" style="background:#facc15"></span></button><button id="pc" title="Clear">🧽</button>`;
  document.body.appendChild(bar);
  $("#pt").onclick=()=>{ penOn=!penOn; pen.classList.toggle("active",penOn); $("#pt").classList.toggle("on",penOn); sizePen(); };
  bar.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ penColor=b.dataset.c; penW=+b.dataset.w; if(!penOn) $("#pt").click(); });
  $("#pc").onclick=()=>pctx.clearRect(0,0,pen.width,pen.height);
  const pos=e=>({x:e.pageX,y:e.pageY});
  pen.addEventListener("pointerdown",e=>{ drawing=true; last=pos(e); pen.setPointerCapture(e.pointerId); });
  pen.addEventListener("pointermove",e=>{ if(!drawing) return; const p=pos(e); pctx.strokeStyle=penColor; pctx.lineWidth=penW*(e.pressure&&e.pointerType==="pen"?0.6+e.pressure:1); pctx.lineCap="round"; pctx.lineJoin="round"; pctx.beginPath(); pctx.moveTo(last.x,last.y); pctx.lineTo(p.x,p.y); pctx.stroke(); last=p; });
  ["pointerup","pointercancel"].forEach(t=>pen.addEventListener(t,()=>drawing=false));
  addEventListener("resize",sizePen);
}

// ---------- confetti ----------
const cv=$("#confetti"), cx=cv.getContext("2d"); let parts=[], anim=null;
function sz(){cv.width=innerWidth;cv.height=innerHeight;} sz(); addEventListener("resize",sz);
function burst(n,top){ const cols=["#f5b700","#7c3aed","#0ea5e9","#16a34a","#ef4444","#ff9f1c","#ec4899"];
  for(let i=0;i<n;i++) parts.push({x:top?Math.random()*cv.width:cv.width/2,y:top?-20:cv.height*.6,vx:(Math.random()-.5)*(top?4:16),vy:top?Math.random()*3+2:-(Math.random()*14+6),r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:0,key:Math.random()<.08});
  if(!anim) loop(); }
function loop(){ cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.a+=p.va;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
    if(p.key){cx.font="22px serif";cx.fillText("🔑",-10,8);}else{cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);}cx.restore();});
  parts=parts.filter(p=>p.y<cv.height+40&&p.life<400); if(parts.length) anim=requestAnimationFrame(loop); else {anim=null;cx.clearRect(0,0,cv.width,cv.height);} }
function bigConfetti(){ burst(160,true); setTimeout(()=>burst(160,true),700); setTimeout(()=>burst(80,false),1300); }

// ================== LIVE CLASS (teacher-paced) ==================
const LIVE = !!(CONFIG.supabaseUrl && !CONFIG.supabaseUrl.startsWith("/*") && CONFIG.supabaseKey && !CONFIG.supabaseKey.startsWith("/*") && window.supabase);
const ROOM = (QUEST?"quest":"lesson")+N;
const live = { status: LIVE ? "connecting" : "off", pace:-1, steps:{}, roster:{}, ch:null, sb:null, pin:null };
function liveOn(){ return LIVE && !QUEST && live.status==="on" && !TEACH; }
function liveWaiting(){ return LIVE && !QUEST && live.status==="connecting" && !TEACH; }
function stepN(b){ return liveOn() ? Math.max(live.steps[b.id]||0, 0) : (S.steps[b.id]||0); }
function deviceId(){ try{ let d=localStorage.getItem("pm2dev"); if(!d){ d=Math.random().toString(36).slice(2,10); localStorage.setItem("pm2dev",d);} return d; }catch(e){ return "x"+Math.random().toString(36).slice(2,8); } }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",3500); }
function livePill(){
  if(!LIVE) return "";
  if(TEACH){ const n=Object.keys(live.roster).length; return `<button class="pill ctl" onclick="openCtl()">${QUEST?"📊 Quest Tracker":"📡 Live Control"} · 👥 ${n}</button>`; }
  if(QUEST) return "";
  if(live.status==="on") return `<span class="pill on">🟢 Live with Mrs. Rees</span>`;
  if(live.status==="connecting") return `<span class="pill wait">⏳ Connecting…</span>`;
  return `<span class="pill off">⚪ Self-paced</span>`;
}
function applyPace(row){
  const fresh = row && (Date.now()-new Date(row.updated_at).getTime() < 8*3600*1000);
  const newPace = fresh ? row.section : -1, newSteps = fresh ? (row.steps||{}) : {};
  const opened = newPace > live.pace && live.pace>=-1 && live.status==="on";
  const stepChanged = JSON.stringify(newSteps)!==JSON.stringify(live.steps);
  live.pace = newPace; live.steps = newSteps;
  if(!S.name || KEYMODE) return;
  if(TEACH){ renderCtl(); nav(); return; }
  L.sections.forEach((s,k)=>renderSec(k)); nav(); sizePen();
  if(opened && newPace>=0){ toast("🔓 Mrs. Rees opened: "+L.sections[newPace].title); setTimeout(()=>jump(newPace),300); }
  else if(stepChanged){ const m=[...document.querySelectorAll("mark.hl.on")][0]; if(m) m.scrollIntoView({behavior:"smooth",block:"center"}); }
}
async function liveStart(){
  if(!LIVE) return;
  try{
    live.sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
    const timer = setTimeout(()=>{ if(live.status==="connecting"){ live.status="off"; if(!TEACH && S.name && !QUEST){ toast("⚠️ Live class not connected — work at your own pace."); render(); } } }, 9000);
    const { data } = QUEST ? {data:null} : await live.sb.from("live_pace").select("*").eq("room", ROOM).maybeSingle();
    live.ch = live.sb.channel("room-"+ROOM, { config:{ presence:{ key: TEACH ? "teacher" : deviceId() } } });
    if(!QUEST) live.ch.on("postgres_changes", { event:"*", schema:"public", table:"live_pace", filter:"room=eq."+ROOM }, p=>applyPace(p.new));
    live.ch.on("presence", { event:"sync" }, ()=>{ const st=live.ch.presenceState(); const r={};
      for(const k in st){ if(k==="teacher") continue; const m=st[k][st[k].length-1]; if(m && m.name) r[k]=m; } live.roster=r; if(TEACH){ renderCtl(); nav(); } });
    live.ch.subscribe(status=>{
      if(status==="SUBSCRIBED"){ clearTimeout(timer); live.status="on"; if(!QUEST){ applyPace(data); if(!TEACH && S.name){ render(); } } else { nav(); } liveTrack(true); }
      if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){ if(live.status!=="on"){ clearTimeout(timer); live.status="off"; if(!TEACH && S.name) render(); } }
    });
  }catch(e){ live.status="off"; if(!TEACH && S.name) render(); }
}
let lastTrack="";
function liveTrack(force){
  if(!LIVE || TEACH || !live.ch || live.status!=="on" || !S.name) return;
  const t=totals(); const done=L.sections.map(s=>secDone(s)?1:0);
  const payload={ name:S.name, done, p:Math.round(t.p*10)/10, n:t.n, a:t.d, t0:S.t0||null, fin:S.doneAt||null, keys: QUEST ? L.sections.map(s=>secDone(s)?keyOf(s).e:"") : null };
  const sig=JSON.stringify(payload); if(!force && sig===lastTrack) return; lastTrack=sig;
  live.ch.track(payload).catch(()=>{});
}
// ---------- teacher control ----------
async function teacherPin(){
  if(live.pin) return live.pin;
  try{ const p=sessionStorage.getItem("pm2livepin"); if(p){ live.pin=p; return p; } }catch(e){}
  const p = prompt("Teacher PIN for Live Control:"); if(!p) return null;
  const { data, error } = await live.sb.rpc("check_pin", { p_pin:p });
  if(error || data!==true){ alert("That PIN didn't work."); return null; }
  live.pin=p; try{ sessionStorage.setItem("pm2livepin",p); }catch(e){} return p;
}
async function setPace(section, steps){
  const pin = await teacherPin(); if(!pin) return;
  const { data, error } = await live.sb.rpc("set_pace", { p_room:ROOM, p_pin:pin, p_section:section, p_steps: steps||{} });
  if(error || data!==true){ alert("Couldn't update the class. Check your connection."); return; }
  live.pace=section; live.steps=steps||{}; renderCtl(); nav();
}
function livePushSteps(){ if(!LIVE || !TEACH || live.status!=="on" || live.pace<0) return; setPace(Math.max(live.pace,0), Object.assign({}, live.steps, S.steps)); }
function startClass(){ if(!confirm("Start a NEW live class for Day "+N+"? Every student goes back to the Warm-Up and the think-aloud resets.")) return;
  S.steps={}; save(); render(); setPace(0, {}); }
function openNext(){ const nx=Math.min(live.pace+1, L.sections.length-1); setPace(nx, Object.assign({}, live.steps, S.steps)); setTimeout(()=>jump(nx),200); }
function openCtl(){ $("#ctl").style.display="flex"; renderCtl(); }
function closeCtl(){ $("#ctl").style.display="none"; }
function renderCtl(){
  const box=$("#ctl"); if(!box || box.style.display!=="flex") return;
  if(QUEST) return renderTracker(box);
  const ros=Object.values(live.roster).sort((a,b)=>a.name.localeCompare(b.name));
  const cur=live.pace;
  const fin = cur>=0 ? ros.filter(r=>r.done && r.done[cur]).length : 0;
  box.innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h2 style="margin:0">📡 Live Control — Day ${N}</h2><button class="btn sm ghost" onclick="closeCtl()">✖ Close</button></div>
    <p style="margin:6px 0">${live.status==="on"?"🟢 Connected":"🔴 Not connected"} · 👥 <b>${ros.length}</b> students logged on${cur>=0?` · <b>${fin} of ${ros.length}</b> finished <b>${L.sections[cur].title}</b>`:" · Class not started"}</p>
    <div class="secbtns">${L.sections.map((s,i)=>`<button class="${i===cur?"cur":(i<cur?"open":"")}" onclick="setPace(${i}, Object.assign({}, live.steps, S.steps))">${i<=cur?"🔓":"🔒"} ${s.icon} ${s.title}</button>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn gold" onclick="openNext()" ${cur>=L.sections.length-1?"disabled":""}>${cur<0?"▶ Open Warm-Up":"🔓 Open next part ▶"}</button>
      <button class="btn ghost sm" onclick="startClass()">🔄 Start a new class</button></div>
    <table><thead><tr><th>Student</th>${L.sections.map(s=>`<th title="${s.title}">${s.icon}</th>`).join("")}<th>⭐ Score</th></tr></thead>
    <tbody>${ros.length?ros.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${L.sections.map((s,i)=>`<td>${r.done&&r.done[i]?"✅":(i<=cur?"⏳":"·")}</td>`).join("")}<td>${r.p}/${r.n}</td></tr>`).join(""):`<tr><td colspan="${L.sections.length+2}" style="text-align:center;color:var(--muted)">No students logged on yet. Have them open the Day ${N} lesson link and type their name.</td></tr>`}</tbody></table>
    <p style="font-size:14px;color:var(--muted);margin-bottom:0">✅ finished that part · ⏳ part is open but not finished · Names and scores are live only — nothing is stored.</p></div>`;
}
function renderTracker(box){
  const ros=Object.values(live.roster).sort((a,b)=>a.name.localeCompare(b.name));
  const done=ros.filter(r=>r.done && r.done.every(x=>x)).length;
  const now=Date.now();
  box.innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h2 style="margin:0">📊 Quest Tracker — Day ${N}</h2><button class="btn sm ghost" onclick="closeCtl()">✖ Close</button></div>
    <p style="margin:6px 0">${live.status==="on"?"🟢 Connected":"🔴 Not connected"} · 👥 <b>${ros.length}</b> students working · <b>${done}</b> finished all 4 rooms</p>
    <table><thead><tr><th>Student</th>${L.sections.map((s,i)=>`<th title="${esc(s.title)}">Room ${i+1}</th>`).join("")}<th>⭐ Score</th><th>⏱️ Min</th></tr></thead>
    <tbody>${ros.length?ros.map(r=>{ const m = r.t0 ? Math.max(0,Math.round(((r.fin||now)-r.t0)/60000)) : "—";
      const cur = r.done ? r.done.findIndex(x=>!x) : 0;
      return `<tr><td><b>${esc(r.name)}</b></td>${L.sections.map((s,i)=>`<td>${r.done&&r.done[i]?(r.keys&&r.keys[i]||"✅"):(i===cur?"✏️":"·")}</td>`).join("")}<td>${r.p}/${r.n}</td><td>${m}${r.fin?" ✔":""}</td></tr>`; }).join("")
      :`<tr><td colspan="${L.sections.length+3}" style="text-align:center;color:var(--muted)">No students working yet. They'll appear when they open the Day ${N} Quest.</td></tr>`}</tbody></table>
    <p style="font-size:14px;color:var(--muted);margin-bottom:0">🥇🥈🥉 key earned in that room · ✏️ working on it now · ⏱️ minutes since they started (✔ = finished) · Live only — nothing is stored.</p></div>`;
}
if(LIVE) liveStart();
if(LIVE && TEACH && QUEST) setInterval(()=>renderCtl(), 30000);

render();
</script>
