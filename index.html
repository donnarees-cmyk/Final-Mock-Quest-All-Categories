<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day 6 Follow-Along</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1e2a5a;--navy2:#2d3b7a;--gold:#f5b700;--gold2:#ffd84d;--bg:#fff8ec;--ink:#1f2340;--muted:#5b6080;--line:#e6dcc8;
--ok:#16a34a;--okbg:#dcfce7;--half:#d97706;--halfbg:#fef3c7;--no:#dc2626;--nobg:#fee2e2;
--d1:#15803d;--d1bg:#dcfce7;--d2:#1d4ed8;--d2bg:#dbeafe;--d3:#7e22ce;--d3bg:#f3e8ff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,.fred{font-family:"Fredoka",system-ui,sans-serif;line-height:1.2}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:12px 16px;border-bottom:5px solid var(--gold)}
header.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#logoBox img{height:64px;background:#fff;border-radius:12px;padding:4px;display:block}
#logoBox .txt{font-family:Fredoka;font-weight:700;font-size:19px;color:var(--gold2)}
.ttl{flex:1;min-width:220px}.ttl h1{margin:0;font-size:25px}.ttl div{opacity:.88;font-size:15px}
.timechip{background:var(--gold);color:var(--navy);border-radius:14px;padding:6px 14px;font-family:Fredoka;font-weight:700;text-align:center}
.timechip b{display:block;font-size:24px;line-height:1}
.card{background:#fff;border-radius:20px;box-shadow:0 3px 0 var(--line),0 8px 24px rgba(30,42,90,.07);padding:20px;margin-bottom:18px;border:2px solid var(--line)}
.btn{border:none;border-radius:16px;padding:12px 20px;font-family:Fredoka;font-weight:600;font-size:19px;background:var(--navy);color:#fff;box-shadow:0 4px 0 #0f1738}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f1738}
.btn.gold{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 #b88700}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:0 3px 0 var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:15px;padding:8px 13px;border-radius:12px}
.listen{white-space:nowrap;flex-shrink:0;border:2px solid var(--navy);background:#eef2ff;color:var(--navy);border-radius:999px;padding:5px 13px;font-weight:700;font-size:15px}
.listen.playing{background:var(--gold);border-color:var(--gold)}
.goal{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.goal .big{font-size:44px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.std{font-size:13px;background:#eef2ff;color:var(--navy2);border-radius:8px;padding:2px 8px;font-weight:700}
/* nav */
nav.track{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.96);backdrop-filter:blur(6px);border-bottom:2px solid var(--line);padding:8px 0}
nav.track .in{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:6px;overflow-x:auto;align-items:center}
nav.track button{flex-shrink:0;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-family:Fredoka;font-weight:600;font-size:15px;color:var(--muted)}
nav.track button.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
nav.track button.now{background:var(--navy);border-color:var(--navy);color:#fff}
nav.track button.lock{opacity:.6}
nav.track .sc{margin-left:auto;flex-shrink:0;font-family:Fredoka;font-weight:700;color:var(--navy);font-size:15px;padding-left:8px}
/* sections */
.sec{scroll-margin-top:64px}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sechead .ic{font-size:34px}
.sechead h2{margin:0;font-size:26px;flex:1}
.mins{background:#fff3c4;color:#8a5a00;border-radius:999px;padding:3px 12px;font-family:Fredoka;font-weight:700;font-size:15px}
.locked{text-align:center;color:var(--muted);border-style:dashed}
.locked .ic{font-size:40px}
.notes{background:#fffbe6;border:2px dashed var(--gold);border-radius:14px;padding:10px 14px;margin:8px 0 14px;font-size:16px}
.notes b{font-family:Fredoka}
.blk{margin:16px 0}
.txt{background:#f6f1e6;border-radius:14px;padding:14px 16px;font-size:19px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flip{perspective:900px;min-height:215px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip .inr{position:relative;width:100%;height:100%;min-height:215px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inr{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:16px;padding:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.flip .f{background:linear-gradient(135deg,var(--navy2),#4f46e5);color:#fff;justify-content:center;align-items:center;text-align:center;font-family:Fredoka;font-weight:700;font-size:21px;border:3px solid var(--gold)}
.flip .f small{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:8px}
.flip .b{background:#fff;border:3px solid var(--navy2);transform:rotateY(180deg);font-size:15.5px;line-height:1.4;overflow:auto;color:var(--ink)}
.flip .b .lb{align-self:flex-end;margin-top:auto}
.fliphint{font-size:14px;color:var(--muted);margin:6px 0 0}
/* passage */
.pass{background:#fff;border:3px solid var(--navy2);border-radius:16px;padding:16px}
.pass .ph{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pass h3{margin:0;font-size:21px;color:var(--navy)}
.pass .p{display:flex;gap:10px;margin:0 0 10px}
.pass .pn{flex:0 0 26px;height:26px;border-radius:8px;background:var(--navy2);color:#fff;text-align:center;line-height:26px;font-family:Fredoka;font-weight:700;font-size:14px;margin-top:2px}
.pass h4{margin:12px 0 6px;color:var(--navy2);font-size:19px}
.pass .poem{white-space:pre-line;font-style:italic;padding-left:12px;border-left:4px solid var(--gold);margin-bottom:10px}
mark.hl{background:transparent;color:inherit;border-radius:4px;transition:background .4s,box-shadow .4s}
mark.hl.on{background:#ffe066;box-shadow:0 0 0 3px #ffe066}
details.reread{background:#fff;border:2px solid var(--navy2);border-radius:14px;padding:10px 14px}
details.reread summary{font-family:Fredoka;font-weight:600;color:var(--navy2);cursor:pointer}
details.reread .pass{border:none;padding:8px 0 0}
/* steps */
.steps{background:#eef2ff;border-radius:16px;padding:14px 16px}
.steps h4{margin:0 0 10px;font-size:19px;color:var(--navy)}
.step{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;animation:pop .35s}
.step .num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);font-family:Fredoka;font-weight:700;display:flex;align-items:center;justify-content:center}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* questions */
.q{border:3px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.dok{font-size:13px;font-weight:700;border-radius:8px;padding:2px 9px}
.dok1{background:var(--d1bg);color:var(--d1)}.dok2{background:var(--d2bg);color:var(--d2)}.dok3{background:var(--d3bg);color:var(--d3)}
.typ{font-size:13px;background:#fff3c4;color:#8a5a00;border-radius:8px;padding:2px 8px;font-weight:700}
.mini{background:#f6f1e6;border-left:5px solid var(--navy2);border-radius:10px;padding:10px 14px;margin:6px 0 10px}
.stemrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.stem{font-weight:700;font-size:19px;margin:4px 0 10px}
.choices{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;color:var(--ink);font-size:17.5px;line-height:1.4}
.ch .lt{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--navy2);display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700;color:var(--navy2)}
.ch.multi .lt{border-radius:8px}
.ch.sel{border-color:var(--navy2);background:#eef2ff}.ch.sel .lt{background:var(--navy2);color:#fff}
.ch.right{border-color:var(--ok);background:#ecfdf5}.ch.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.wrong{border-color:var(--no);background:#fef2f2}.ch.wrong .lt{background:var(--no);border-color:var(--no);color:#fff}
.part{border-top:2px dashed var(--line);padding-top:10px;margin-top:12px}
.part.first{border-top:none;margin-top:0;padding-top:0}
.howto{font-size:15px;color:var(--muted);margin:0 0 8px}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:16.5px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.half{background:var(--halfbg);border:2px solid var(--half)}.fb.no{background:var(--nobg);border:2px solid var(--no)}
.fb h4{margin:0 0 3px;font-size:19px}
.act{display:flex;justify-content:flex-end;margin-top:12px}
/* sort */
.sortrow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px;background:#fff}
.sortrow .it{font-weight:700;margin-bottom:8px}
.sortrow .opts{display:flex;flex-wrap:wrap;gap:6px}
.sortrow .opts button{border:2px solid var(--navy2);background:#fff;color:var(--navy2);border-radius:999px;padding:5px 12px;font-family:Fredoka;font-weight:600;font-size:15px}
.sortrow .opts button.sel{background:var(--navy2);color:#fff}
.sortrow.right{border-color:var(--ok);background:#f0fdf4}.sortrow.wrong{border-color:var(--no);background:#fef2f2}
.sortrow .opts button.ans{background:var(--ok);border-color:var(--ok);color:#fff}
.sortrow .opts button.bad{background:var(--no);border-color:var(--no);color:#fff}
/* done + shot */
.secdone{background:var(--okbg);border:2px solid var(--ok);border-radius:14px;padding:10px 14px;font-family:Fredoka;font-weight:600;color:var(--ok);text-align:center;margin-top:12px}
.shot{border:4px dashed var(--navy2);background:#eef2ff;border-radius:20px;padding:16px;margin:12px 0}
.shotT{font-family:Fredoka;font-weight:700;font-size:22px;color:var(--navy);margin-bottom:12px;text-align:center}
.shotG{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.shotG div{background:#fff;border-radius:14px;padding:10px;border:2px solid #c7d2fe}
.shotG span{display:block;font-size:14px;color:var(--muted);font-weight:700}
.shotG b{display:block;font-family:Fredoka;font-size:23px;color:var(--navy);line-height:1.2}
.shotR{font-weight:700;margin-top:10px;color:var(--navy2);text-align:center}
.shotH{font-size:15px;color:var(--muted);margin-top:8px;text-align:center}
.welcome{max-width:560px;margin:20px auto;text-align:center}
.welcome input{width:100%;font-size:24px;padding:12px;border-radius:14px;border:3px solid var(--navy2);text-align:center;font-family:Fredoka;margin:12px 0}
/* teacher pen */
#pen{position:absolute;left:0;top:0;z-index:30;pointer-events:none}
#pen.active{pointer-events:auto;touch-action:none;cursor:crosshair}
#penbar{position:fixed;right:14px;bottom:14px;z-index:40;display:flex;gap:6px;background:#fff;border:3px solid var(--navy);border-radius:999px;padding:6px 8px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#penbar button{border:none;background:#eef2ff;border-radius:999px;width:44px;height:44px;font-size:20px}
#penbar button.on{outline:3px solid var(--gold)}
#penbar .sw{width:28px;height:28px;border-radius:50%;display:inline-block;vertical-align:middle}
.keyq{border-bottom:2px dashed var(--line);padding:10px 0}.keyq .ans{color:var(--ok);font-weight:700}
footer{text-align:center;color:var(--muted);font-size:13px;padding:22px 16px}
.keyban{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#fff3c4,#ffe08a);border:3px solid var(--gold);border-radius:16px;padding:12px 16px;margin-top:14px;font-size:18px;animation:pop .4s}
.keyban span{font-size:44px}
.livewait{background:#fff3c4;border:2px dashed var(--gold);border-radius:12px;padding:10px 14px;font-family:Fredoka;font-weight:600;color:#8a5a00}
.pill{flex-shrink:0;border-radius:999px;padding:5px 12px;font-family:Fredoka;font-weight:700;font-size:14px;margin-left:6px;border:none}
.pill.on{background:#dcfce7;color:#15803d}.pill.off{background:#fee2e2;color:#b91c1c}.pill.wait{background:#fff3c4;color:#8a5a00}
.pill.ctl{background:var(--navy);color:#fff;cursor:pointer}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--navy);color:#fff;font-family:Fredoka;font-weight:700;font-size:20px;padding:12px 22px;border-radius:16px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
#ctl{position:fixed;inset:0;background:rgba(15,23,56,.55);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
#ctl .box{background:#fff;border-radius:20px;max-width:880px;width:100%;padding:20px;border:4px solid var(--gold)}
#ctl table{width:100%;border-collapse:collapse;font-size:16px;margin-top:8px}
#ctl th,#ctl td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center}
#ctl td:first-child,#ctl th:first-child{text-align:left}
.secbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.secbtns button{border:2px solid var(--navy2);background:#fff;color:var(--navy2);border-radius:12px;padding:8px 12px;font-family:Fredoka;font-weight:600;font-size:16px}
.secbtns button.open{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.secbtns button.cur{background:var(--navy);border-color:var(--navy);color:#fff}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){body{font-size:17px}.cards,.shotG{grid-template-columns:1fr}.ttl h1{font-size:20px}#logoBox img{height:46px}}
@media print{nav.track,#penbar,.listen{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div id="logoBox"></div>
  <div class="ttl"><h1 id="htitle"></h1><div id="hsub"></div></div>
  <div class="timechip"><b id="tmin">25</b>minutes</div>
</div></header>
<nav class="track"><div class="in" id="nav"></div></nav>
<main class="wrap" id="app"></main>
<footer>Grade 6 ELA · PM2 Follow-Along Review · Your work saves automatically on this iPad 💾</footer>
<canvas id="pen"></canvas>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<div id="ctl"></div>

<script>
// ===== Follow-Along Lessons: Days 1–3 =====
var LESSONS = LESSONS || {};
const CAT = { P:"Prose & Poetry", I:"Informational Text", V:"Across Genres & Vocabulary" };

LESSONS[1] = {
 n:1, date:"Mon 11/30", title:"Context Clues & Word Roots", cat:"V",
 stds:["ELA.6.V.1.3 Context clues","ELA.6.V.1.2 Roots & affixes"],
 goal:"I can figure out the meaning of unknown words using context clues and word parts.",
 sections:[
  { key:"warm", title:"Warm-Up", icon:"🔥", min:3,
    notes:["Have students answer on their own, then ask: 'Who has ever skipped a word they didn't know? On PM2, we never skip — we unlock it.'"],
    blocks:[
     {t:"q", id:"1w1", dok:1, type:"mc", stem:"What is a context clue?", choices:["a hint in the words or sentences around an unknown word that helps you figure out its meaning","the dictionary definition printed at the bottom of a page","the title of the passage","a picture that comes with the text"], answer:0, why:"Context = the words AROUND the word. The clue is hiding in the sentence before, the same sentence, or the sentence after."},
     {t:"q", id:"1w2", dok:1, type:"mc", stem:"The prefix un- in unbreakable means…", choices:["again","not","before","too much"], answer:1, why:"un- = not. Unbreakable = NOT able to be broken."}
    ]},
  { key:"learn", title:"Learn It", icon:"💡", min:6,
    notes:["Tap each card together. Ask students to give their own example for one card.","Point out signal words — they're the 'keyhole' that tells you which clue type to use."],
    blocks:[
     {t:"text", html:"When you hit an unknown word on PM2, you have <b>two keys</b> 🗝️🗝️:<br>1️⃣ <b>Context clues</b> — the words around it.<br>2️⃣ <b>Word parts</b> — prefixes, roots, and suffixes.<br>Tap each card to learn the 5 types of context clues."},
     {t:"cards", cards:[
      {f:"📘 Definition", b:"The author TELLS you the meaning. Look for commas, dashes, or the words <i>or</i>, <i>which is</i>, <i>means</i>.<br><br><i>The <b>arid</b>, or very dry, land had no trees.</i>"},
      {f:"🟰 Synonym / Restatement", b:"A word or phrase with a SIMILAR meaning is nearby.<br><br><i>The puppy was <b>timid</b>; it was shy around strangers.</i>"},
      {f:"↔️ Antonym / Contrast", b:"The OPPOSITE is nearby. Signal words: <i>but, unlike, however, instead, although</i>.<br><br><i>Unlike her talkative brother, Mia was <b>reticent</b>.</i>"},
      {f:"📋 Example", b:"Examples help you figure it out. Signal words: <i>such as, including, for example</i>.<br><br><i><b>Citrus</b> fruits, such as oranges, lemons, and limes, are full of vitamin C.</i>"},
      {f:"🕵️ Inference", b:"Use the WHOLE situation and what you already know.<br><br><i>After running five miles, José was <b>exhausted</b> and collapsed on the couch.</i>"},
      {f:"🧩 Word Parts", b:"<b>Prefixes:</b> un- (not), re- (again), pre- (before), mis- (wrongly), sub- (under)<br><b>Roots:</b> tele (far), port (carry), dict (say), struct (build), graph (write), aud (hear), spect (look), bio (life)<br><b>Suffixes:</b> -less (without), -ful (full of), -able (can be)"}
     ]},
     {t:"sort", id:"1s1", dok:2, prompt:"Sort it! Tap the type of context clue each sentence uses.", cats:["Definition","Contrast","Example"],
      items:[
       {x:"A meteorologist, a scientist who studies weather, predicted rain.", c:0},
       {x:"Unlike the noisy cafeteria, the library was tranquil.", c:1},
       {x:"Mollusks, such as snails, clams, and octopuses, have soft bodies.", c:2},
       {x:"Jayden was frugal, but his sister spent every dollar she got.", c:1},
       {x:"Precipitation, or water falling from the sky, can be rain or snow.", c:0},
       {x:"Many amphibians, including frogs and salamanders, live near water.", c:2}
      ], why:"Commas + 'or' / a definition = Definition. 'Unlike' and 'but' = Contrast. 'Such as' and 'including' = Example."},
     {t:"q", id:"1l1", dok:1, type:"mc", stem:"Checkpoint: Which signal word usually tells you to look for an OPPOSITE (antonym) clue?", choices:["such as","however","or","which means"], answer:1, why:"However, but, unlike, and instead all signal a CONTRAST — the clue means the opposite."}
    ]},
  { key:"model", title:"Watch Me", icon:"👀", min:5,
    notes:["Click 'Next step' one at a time and think aloud. Students watch the highlights appear in the passage.","Use the ✏️ pen to circle the signal word 'Unlike'."],
    blocks:[
     {t:"passage", id:"1p1", title:"The Night Market", text:`Every Saturday night, the parking lot behind the library transforms into a bustling market. {{a|Dozens of vendors set up booths, shoppers crowd the aisles, and music drifts from a speaker on every corner.}} {{b|Unlike the quiet, empty lot of the morning}}, the night market is alive with noise and motion.

Some vendors sell delectable treats, {{c|such as warm empanadas, sweet mango slices, and fresh churros}}, that make everyone's mouth water.`},
     {t:"steps", id:"1m", title:"How I unlock the word bustling", steps:[
      {s:"First, I find the word and reread its sentence: 'the parking lot… transforms into a bustling market.'"},
      {s:"Next, I read the sentence AFTER it. Dozens of vendors, crowded aisles, music on every corner — lots going on!", hl:["a"]},
      {s:"I spot a contrast signal word: 'Unlike the quiet, empty lot.' So bustling is the OPPOSITE of quiet and empty.", hl:["b"]},
      {s:"My guess: bustling means busy and full of activity."},
      {s:"I plug it back in: 'transforms into a busy, full-of-activity market.' It makes sense! ✔ Unlocked."}
     ]},
     {t:"q", id:"1m1", dok:2, type:"mc", stem:"Checkpoint: Now you try. Using the same steps, what does delectable mean in paragraph 2?", choices:["expensive","delicious","very hot","strange"], answer:1, why:"Example clue: 'such as warm empanadas, sweet mango slices, and fresh churros' that 'make everyone's mouth water.' Delectable = delicious."}
    ]},
  { key:"we", title:"Try It Together", icon:"🤝", min:6,
    notes:["Read the passage aloud together. Students answer each question, then discuss: 'What clue did you use?'"],
    blocks:[
     {t:"passage", id:"1p2", title:"The Rescue at Pine Lake", text:`The lake's surface was a sheet of ice, but it was too thin to support a dog's weight. When Bella broke through, she began to paddle frantically, splashing and scrambling as she tried to climb out.

A firefighter carefully crawled across the ice on his stomach, spreading out his weight so the ice wouldn't crack. He pulled Bella out and carried her to the shore, where the crowd erupted into cheers.

Later, the fire chief said the rescue was a "textbook example" of ice safety. A transport van took Bella to the vet, where she made a full recovery.`},
     {t:"q", id:"1t1", dok:2, type:"mc", stem:"What does frantically mean in paragraph 1?", choices:["slowly and calmly","in a wild, panicked way","quietly","happily"], answer:1, why:"The clue: 'splashing and scrambling as she tried to climb out.' Bella was scared and out of control."},
     {t:"q", id:"1t2", dok:2, type:"multi", pick:2, stem:"The root port means \"carry.\" Select the TWO words from the passage that contain this root.", choices:["support","surface","transport","rescue","recovery"], answer:[0,2], why:"sup-PORT (carry from below — hold up) and trans-PORT (carry across). Find the root inside the word!"},
     {t:"q", id:"1t3", dok:2, type:"mc", stem:"What does erupted mean in the phrase \"the crowd erupted into cheers\"?", choices:["suddenly burst out","walked away","stayed silent","argued"], answer:0, why:"Think of a volcano erupting — a sudden burst. After the rescue, the crowd suddenly burst into cheers."}
    ]},
  { key:"challenge", title:"Challenge", icon:"🧗", min:3,
    notes:["DOK 3 = thinking about WHY. Have students explain their reasoning to a partner before checking."],
    blocks:[
     {t:"passage", ref:"1p2"},
     {t:"q", id:"1c1", dok:3, type:"ab",
      a:{stem:"Part A: What does the phrase \"textbook example\" most likely mean as used in the passage?", choices:["a perfect model of the right way to do something","an example printed in a schoolbook","a boring story","a mistake to learn from"], answer:0},
      b:{stem:"Part B: Which detail BEST supports the answer to Part A?", choices:["\"A firefighter carefully crawled across the ice on his stomach, spreading out his weight so the ice wouldn't crack.\"","\"The lake's surface was a sheet of ice\"","\"the crowd erupted into cheers\"","\"where she made a full recovery\""], answer:0},
      why:"The firefighter did everything RIGHT — he spread out his weight so the ice wouldn't crack. That's a perfect model of ice safety."},
     {t:"q", id:"1c2", dok:3, type:"mc", stem:"A classmate says frantically just means \"quickly.\" Why is \"in a wild, panicked way\" a BETTER meaning?", choices:["because 'splashing and scrambling' shows fear and loss of control, not just speed","because frantically is a long word","because dogs cannot swim","because the passage says Bella was slow"], answer:0, why:"The best meaning fits ALL the clues. Scrambling and splashing show panic — not just speed."}
    ]},
  { key:"exit", title:"Exit Key", icon:"🔑", min:2, exit:true,
    notes:["Students finish on their own and screenshot the box for Canvas."],
    blocks:[
     {t:"q", id:"1x1", dok:1, type:"mc", stem:"The root graph means…", choices:["write","see","carry","life"], answer:0, why:"graph = write: autograph, paragraph, biography."},
     {t:"q", id:"1x2", dok:2, type:"mc", mini:"The new rule was mandatory; every student had to follow it, with no exceptions.", stem:"What does mandatory mean?", choices:["optional","required","confusing","new"], answer:1, why:"Restatement clue after the semicolon: 'every student had to follow it, with no exceptions.'"},
     {t:"q", id:"1x3", dok:3, type:"mc", mini:"Leo's essay was concise. While other students wrote five pages, Leo made the same points in one.", stem:"Which choice correctly names the clue type AND the meaning of concise?", choices:["Contrast clue; concise means brief and to the point","Example clue; concise means very long","Definition clue; concise means messy","Contrast clue; concise means confusing"], answer:0, why:"'While other students wrote five pages' signals a contrast. Leo used only one page = brief and to the point."}
    ]}
 ]};

LESSONS[2] = {
 n:2, date:"Tue 12/1", title:"Theme, Plot & Character", cat:"P",
 stds:["ELA.6.R.1.1 Literary elements","ELA.6.R.1.2 Theme","ELA.6.R.1.3 Point of view"],
 goal:"I can determine a theme, trace the plot, and explain how a character changes.",
 sections:[
  { key:"warm", title:"Warm-Up", icon:"🔥", min:3,
    notes:["Quick debate: 'Is friendship a theme?' (No — it's a topic. A theme is a full sentence lesson.)"],
    blocks:[
     {t:"q", id:"2w1", dok:1, type:"mc", stem:"Which of these is a THEME, not just a topic?", choices:["friendship","True friends stand by you when times are hard.","soccer","a lost dog"], answer:1, why:"A topic is one word. A theme is a full-sentence life lesson."},
     {t:"q", id:"2w2", dok:1, type:"mc", stem:"The part of the plot where the conflict reaches its highest, most exciting point is the…", choices:["exposition","rising action","climax","resolution"], answer:2, why:"The climax is the top of the plot mountain — the turning point."}
    ]},
  { key:"learn", title:"Learn It", icon:"💡", min:6,
    notes:["Draw the plot mountain on the board as you flip cards.","Ask: 'Which STEAL clue is most powerful?' (Actions — they show who someone really is.)"],
    blocks:[
     {t:"text", html:"Stories on PM2 ask about <b>theme</b>, <b>plot</b>, <b>character</b>, and <b>point of view</b>. Tap each card."},
     {t:"cards", cards:[
      {f:"⛰️ Plot Mountain", b:"<b>Exposition</b> (characters, setting) → <b>Rising Action</b> (problem builds) → <b>Climax</b> (turning point) → <b>Falling Action</b> (things settle) → <b>Resolution</b> (problem solved)."},
      {f:"🎯 Theme Formula", b:"<b>Topic + what the author says about it = Theme</b><br><br>Courage → <i>Courage means acting even when you're afraid.</i><br><br>✅ Full sentence ✅ Fits anyone's life ❌ No character names"},
      {f:"🕵️ STEAL Characters", b:"Learn about a character from their <b>S</b>peech, <b>T</b>houghts, <b>E</b>ffect on others, <b>A</b>ctions, and <b>L</b>ooks."},
      {f:"🔄 Character Change", b:"Compare the BEGINNING to the END. Ask: <i>What did the character learn? What made them change?</i> The turning point usually causes the change."},
      {f:"👁️ Point of View", b:"<b>First person</b> (I, me) — we only know the narrator's thoughts.<br><b>Third person limited</b> (he, she) — we know ONE character's thoughts.<br><b>Third person omniscient</b> — we know EVERYONE's thoughts."}
     ]},
     {t:"sort", id:"2s1", dok:2, prompt:"Climb the plot mountain! Tap the plot part for each event in \"The Spelling Bee.\"", cats:["Exposition","Rising Action","Climax","Falling Action","Resolution"],
      items:[
       {x:"Priya practices spelling words every night with her grandmother.", c:0},
       {x:"At the school bee, the words get harder until only three spellers are left.", c:1},
       {x:"Priya gets the final word, \"rhythm,\" and must spell it to win.", c:2},
       {x:"She spells it correctly, and the crowd cheers.", c:3},
       {x:"Priya hugs her grandmother and hangs the trophy above the kitchen table.", c:4}
      ], why:"Beginning info → problem builds → biggest moment → things settle → wrap-up."},
     {t:"q", id:"2l1", dok:1, type:"mc", stem:"Checkpoint: In STEAL, what does the A stand for?", choices:["Attitude","Actions","Age","Answers"], answer:1, why:"Actions! What a character DOES shows who they really are."}
    ]},
  { key:"model", title:"Watch Me", icon:"👀", min:5,
    notes:["Think aloud through each step. Circle Kenji's choice ('Instead…') with the pen."],
    blocks:[
     {t:"passage", id:"2p1", title:"The Broken Kite", text:`Kenji's little sister, Aiko, had begged all week to fly his dragon kite. "You'll break it," he told her every time. On Saturday, while Kenji was at practice, Aiko snuck the kite outside. A gust of wind snapped the string, and the kite crashed into the neighbor's tree, its paper wing torn.

When Kenji got home, Aiko was waiting on the porch, eyes red. "I'm sorry," she whispered, holding up the torn kite. "I'll give you my allowance to fix it."

{{a|Kenji wanted to yell. Instead, he looked at the kite, then at his sister.}} {{b|"Forget the allowance," he said, sitting down beside her. "Let's fix it together. I'll show you how to fly it the right way."}}

{{c|By Sunday afternoon, the patched dragon was soaring over the park, Aiko holding the string with both hands while Kenji cheered her on.}}`},
     {t:"steps", id:"2m", title:"How I find the theme", steps:[
      {s:"Who is the main character, and what is the conflict? Kenji — his sister broke his favorite kite."},
      {s:"How does the main character respond? He WANTED to yell, but he chose to be kind instead.", hl:["a"]},
      {s:"What does he say and do? He offers to fix the kite together and teach her.", hl:["b"]},
      {s:"How does it end? They fly it together, and he cheers her on.", hl:["c"]},
      {s:"Topic: forgiveness. What does the author say about it? → Theme: Forgiveness can turn a mistake into a chance to grow closer. ✔ Full sentence, fits anyone's life."}
     ]},
     {t:"q", id:"2m1", dok:2, type:"mc", stem:"Checkpoint: Which detail BEST shows that Kenji is patient?", choices:["\"Let's fix it together. I'll show you how to fly it the right way.\"","\"You'll break it,\" he told her every time.","Kenji was at practice on Saturday.","The kite crashed into the neighbor's tree."], answer:0, why:"Patience = staying calm and taking time to help. Offering to fix it AND teach her shows patience."}
    ]},
  { key:"we", title:"Try It Together", icon:"🤝", min:6,
    notes:["Read aloud. Pause after 'Her face burned.' Ask: 'What's Destiny feeling? How do you know?'"],
    blocks:[
     {t:"passage", id:"2p2", title:"The Tryout", text:`Destiny had never missed a free throw at practice. But at tryouts, with the coach's clipboard in hand and twenty girls watching, her first shot clanged off the rim. So did her second. Her face burned.

"Shake it off," whispered Marisol, a seventh grader who had made the team last year. "Everyone misses. Coach is watching how you react, not just whether you score."

Destiny took a breath and remembered her dad's words: Reset, then repeat. She jogged back to the line, bent her knees, and followed through just like she had a thousand times in the driveway.

Swish.

At the end of the day, the coach posted the roster. Destiny's name was there. Next to it, someone had drawn a small star. Underneath, in Marisol's handwriting: Told you.`},
     {t:"q", id:"2t1", dok:2, type:"mc", stem:"How does Marisol affect the plot?", choices:["She makes Destiny miss her shots.","She gives advice that helps Destiny calm down and recover.","She decides who makes the team.","She teaches Destiny how to shoot."], answer:1, why:"E in STEAL = Effect on others. Marisol's words change Destiny's mindset, which changes the outcome."},
     {t:"q", id:"2t2", dok:2, type:"multi", pick:2, stem:"Select the TWO details that show HOW Destiny overcomes her setback.", choices:["\"Destiny took a breath and remembered her dad's words\"","\"her first shot clanged off the rim\"","\"bent her knees, and followed through just like she had a thousand times\"","\"twenty girls watching\"","\"Destiny's name was there\""], answer:[0,2], why:"Overcoming = what she DOES to fix the problem: breathing, remembering advice, and using her practiced form."},
     {t:"q", id:"2t3", dok:2, type:"mc", stem:"Which statement BEST expresses a theme of the story?", choices:["Basketball is harder than it looks.","How you respond to a setback matters more than the setback itself.","Older students always help younger ones.","You should never miss a free throw."], answer:1, why:"Coach is 'watching how you react.' Destiny resets and succeeds — the lesson is about responding to setbacks."}
    ]},
  { key:"challenge", title:"Challenge", icon:"🧗", min:3,
    notes:["Push for evidence: 'Point to the exact words that prove it.'"],
    blocks:[
     {t:"passage", ref:"2p2"},
     {t:"q", id:"2c1", dok:3, type:"ab",
      a:{stem:"Part A: What does the note \"Told you.\" at the end reveal about Marisol?", choices:["She believed in Destiny all along and is happy for her.","She is bragging that she made the team.","She is annoyed that Destiny didn't listen.","She wrote the team roster."], answer:0},
      b:{stem:"Part B: Which detail BEST supports the answer to Part A?", choices:["\"'Shake it off,' whispered Marisol… 'Everyone misses.'\"","\"a seventh grader who had made the team last year\"","\"the coach posted the roster\"","\"her first shot clanged off the rim\""], answer:0},
      why:"'Told you' points back to what Marisol said earlier — she encouraged Destiny and knew she could do it."},
     {t:"q", id:"2c2", dok:3, type:"mc", stem:"How would the story be DIFFERENT if Marisol were the narrator?", choices:["Readers would learn Marisol's thoughts but would not feel Destiny's embarrassment from the inside.","Readers would know every character's thoughts.","The story would have a different ending.","Destiny would not make the team."], answer:0, why:"Point of view controls what we know. 'Her face burned' is Destiny's feeling — Marisol could only guess it."}
    ]},
  { key:"exit", title:"Exit Key", icon:"🔑", min:2, exit:true,
    notes:["Independent. Screenshot the box for Canvas."],
    blocks:[
     {t:"q", id:"2x1", dok:1, type:"mc", stem:"The resolution of a story is when…", choices:["the characters are introduced","the conflict is solved and the story wraps up","the problem first appears","the most exciting moment happens"], answer:1, why:"Resolution = the problem is RESOLVED (solved)."},
     {t:"q", id:"2x2", dok:2, type:"mc", mini:"Every day, Sam gave half his lunch to the new student, who kept forgetting his.", stem:"Which trait BEST describes Sam?", choices:["generous","forgetful","shy","competitive"], answer:0, why:"Sam's ACTION — sharing his lunch every day — shows he is generous."},
     {t:"q", id:"2x3", dok:3, type:"mc", stem:"Think about \"The Broken Kite\" and \"The Tryout.\" Which theme fits BOTH stories?", choices:["Support from others can help people grow after a mistake.","Sports are more important than hobbies.","Older siblings are always right.","It is best to solve problems alone."], answer:0, why:"Kenji helps Aiko after she breaks the kite; Marisol helps Destiny after she misses. Both show support helping someone grow."}

LESSONS[3] = {
 n:3, date:"Wed 12/2", title:"Central Idea & Text Structure", cat:"I",
 stds:["ELA.6.R.2.1 Text structure","ELA.6.R.2.2 Central idea","ELA.6.R.3.2 Summarize"],
 goal:"I can determine the central idea and explain how a text is organized.",
 sections:[
  { key:"warm", title:"Warm-Up", icon:"🔥", min:3,
    notes:["Ask: 'Why would an author choose compare/contrast instead of sequence?'"],
    blocks:[
     {t:"q", id:"3w1", dok:1, type:"mc", stem:"The central idea of a text is…", choices:["the most interesting fact","what the whole text is mostly about","the first sentence","the title"], answer:1, why:"Central idea = the BIG idea that covers the whole text."},
     {t:"q", id:"3w2", dok:1, type:"mc", stem:"Which signal words show COMPARE and CONTRAST?", choices:["first, next, finally","because, as a result","similarly, however, unlike","the problem is, one solution"], answer:2, why:"Similarly = alike. However/unlike = different."}
    ]},
  { key:"learn", title:"Learn It", icon:"💡", min:6,
    notes:["Hold up an umbrella (or draw one): central idea on top, details are the raindrops underneath."],
    blocks:[
     {t:"text", html:"🌂 <b>Central idea = the umbrella.</b> Every detail (raindrop) fits underneath it. A single detail is NEVER the central idea.<br>🏗️ <b>Text structure = how the author builds the text.</b> Signal words are your blueprint. Tap each card."},
     {t:"cards", cards:[
      {f:"📝 Description", b:"Describes a topic with details and characteristics.<br><i>Signal words: for example, such as, characteristics</i>"},
      {f:"🔢 Sequence / Chronological", b:"Events or steps in order.<br><i>Signal words: first, next, then, finally, in 1990, later</i>"},
      {f:"⚖️ Compare & Contrast", b:"How two things are alike and different.<br><i>Signal words: similarly, both, however, unlike, while</i>"},
      {f:"➡️ Cause & Effect", b:"Why something happens and what happens because of it.<br><i>Signal words: because, so, as a result, therefore, led to</i>"},
      {f:"🛠️ Problem & Solution", b:"A problem and how it is (or could be) solved.<br><i>Signal words: problem, solution, solve, one answer is</i>"},
      {f:"✂️ Summary Rules", b:"✅ Central idea + key points<br>✅ Your own words<br>✅ Short<br>❌ No opinions<br>❌ No tiny details"}
     ]},
     {t:"sort", id:"3s1", dok:2, prompt:"Sort it! Tap the text structure each example uses.", cats:["Description","Sequence","Compare/Contrast","Cause/Effect","Problem/Solution"],
      items:[
       {x:"The giant panda has black-and-white fur, round ears, and a large, sturdy body.", c:0},
       {x:"First, mix the flour and water. Then, knead the dough for ten minutes.", c:1},
       {x:"Alligators have wide, U-shaped snouts, while crocodiles have narrow, V-shaped snouts.", c:2},
       {x:"As a result of the drought, crops failed across the region.", c:3},
       {x:"Plastic is filling our oceans. One solution is to use reusable bags and bottles.", c:4}
      ], why:"Look for the signal words: features (description), first/then (sequence), while (contrast), as a result (cause/effect), solution (problem/solution)."},
     {t:"q", id:"3l1", dok:1, type:"mc", stem:"Checkpoint: Why is a central idea like an umbrella?", choices:["It covers all of the details in the text.","It is the shortest sentence.","It always comes last.","It is about the weather."], answer:0, why:"Every detail fits under it — just like raindrops under an umbrella."}
    ]},
  { key:"model", title:"Watch Me", icon:"👀", min:5,
    notes:["Model previewing the headings FIRST. Circle the headings with the pen."],
    blocks:[
     {t:"passage", id:"3p1", title:"Florida's Underwater Cities", text:`## A Reef in Danger
Florida's Coral Reef stretches about 350 miles along the state's southeast coast. It is the only coral reef in the continental United States. {{a|Reefs provide homes for thousands of kinds of sea life, protect beaches from storm waves, and bring millions of visitors to Florida each year.}} But the reef is in trouble. {{b|Rising ocean temperatures can cause corals to "bleach," turning white as they lose the tiny algae that feed them. A disease that appeared in 2014 has also killed many corals.}}

## Growing a Comeback
{{c|Scientists are fighting back with coral nurseries. Divers grow small pieces of coral on underwater "trees" until they are large enough to plant back on the reef.}} Each young coral is attached to the reef by hand. It is slow work, but many thousands of corals have already been replanted. With time and care, Florida's underwater cities may thrive again.`},
     {t:"steps", id:"3m", title:"How I find the structure and central idea", steps:[
      {s:"Preview the headings: 'A Reef in Danger' and 'Growing a Comeback.' Headings are a blueprint for the structure!"},
      {s:"Section 1 details: why the reef matters…", hl:["a"]},
      {s:"…and what is harming it: heat and disease. That's a PROBLEM.", hl:["b"]},
      {s:"Section 2 details: coral nurseries regrow and replant corals. That's a SOLUTION.", hl:["c"]},
      {s:"Structure: Problem and Solution. Central idea (the umbrella over both): Florida's Coral Reef is threatened, but scientists are working to restore it. ✔"}
     ]},
     {t:"q", id:"3m1", dok:2, type:"mc", stem:"Checkpoint: Why does the author include the sentence about reefs providing homes, protecting beaches, and bringing visitors?", choices:["to show why the reef is important to save","to explain how corals bleach","to compare reefs with beaches","to tell the history of Florida"], answer:0, why:"Before describing the problem, the author shows WHY it matters — the reef helps sea life, beaches, and people."}
    ]},
  { key:"we", title:"Try It Together", icon:"🤝", min:6,
    notes:["Have students hunt for signal words first, then answer."],
    blocks:[
     {t:"passage", id:"3p2", title:"Why Do Leaves Change Color?", text:`In summer, leaves are green because they are full of chlorophyll, a chemical that helps plants turn sunlight into food. Chlorophyll is so plentiful that it hides other colors in the leaf.

As fall arrives, the days grow shorter and the nights grow cooler. Because there is less sunlight, trees stop making chlorophyll. As a result, the green fades away, and yellow and orange colors that were hidden all summer finally show through.

Some trees, like red maples, also make new red and purple colors in the fall when sugars get trapped in their leaves. That is why a single forest can blaze with so many colors at once.`},
     {t:"q", id:"3t1", dok:2, type:"mc", stem:"Which text structure does the author mainly use?", choices:["compare and contrast","cause and effect","problem and solution","description of a single tree"], answer:1, why:"The passage explains WHY leaves change (less sunlight) and WHAT happens as a result (colors show)."},
     {t:"q", id:"3t2", dok:2, type:"multi", pick:2, stem:"Select the TWO signal words or phrases from paragraph 2 that show cause and effect.", choices:["Because","As fall arrives","As a result","finally","nights grow cooler"], answer:[0,2], why:"'Because' introduces a cause; 'As a result' introduces an effect."},
     {t:"q", id:"3t3", dok:2, type:"mc", stem:"Which statement BEST expresses the central idea?", choices:["Red maples make purple colors.","Chlorophyll is a chemical.","Leaves change color in fall because shorter days cause trees to stop making chlorophyll, revealing and creating other colors.","Forests are beautiful in the fall."], answer:2, why:"It's the umbrella: it covers the cause (shorter days), the effect (colors appear), and the new colors in paragraph 3."}
    ]},
  { key:"challenge", title:"Challenge", icon:"🧗", min:3,
    notes:["DOK 3: How do the PARTS work together? Ask students to defend their heading choice."],
    blocks:[

     {t:"q", id:"3c1", dok:3, type:"ab",
      a:{stem:"Part A: How does paragraph 1 help the reader understand paragraph 2?", choices:["It explains that chlorophyll hides other colors, so readers understand why colors appear when it goes away.","It describes what red maples look like.","It argues that summer is better than fall.","It lists the steps for making food."], answer:0},
      b:{stem:"Part B: Which sentence from paragraph 1 BEST supports the answer to Part A?", choices:["\"Chlorophyll is so plentiful that it hides other colors in the leaf.\"","\"In summer, leaves are green\"","\"a chemical that helps plants turn sunlight into food\"","\"That is why a single forest can blaze with so many colors at once.\""], answer:0},
      why:"Paragraph 1 sets up the key fact — chlorophyll HIDES colors — so paragraph 2's effect makes sense."},
     {t:"q", id:"3c2", dok:3, type:"mc", stem:"Which would be the BEST heading for paragraph 3?", choices:["Making New Colors","Why Trees Need Sunlight","The Shortest Day of the Year","Green All Year Long"], answer:0, why:"Paragraph 3 is about trees making NEW red and purple colors. A heading must fit the whole paragraph."}
    ]},
  { key:"exit", title:"Exit Key", icon:"🔑", min:2, exit:true,
    notes:["Independent. Screenshot the box for Canvas."],
    blocks:[

     {t:"q", id:"3x2", dok:2, type:"mc", mini:"Sea turtles face many dangers. Plastic trash can be mistaken for food. Bright beach lights confuse hatchlings. Fishing nets can trap them.", stem:"What is the central idea?", choices:["Plastic looks like food.","Sea turtles face many dangers.","Hatchlings are confused by lights.","Fishing nets are large."], answer:1, why:"The first sentence is the umbrella; each sentence after it is one danger (a detail)."},
     {t:"q", id:"3x3", dok:3, type:"mc", stem:"A student summarizes the coral reef article this way: \"Corals turn white.\" Why is this a WEAK summary?", choices:["It includes only one small detail and leaves out the solution.","It is too long.","It uses the student's own words.","It includes the central idea."], answer:0, why:"A strong summary covers the central idea and key points — the problem AND the solution."}

LESSONS[4] = {
 n:4, date:"Thu 12/3", title:"Argument: Claims & Evidence", cat:"I",
 stds:["ELA.6.R.2.4 Argument","ELA.6.R.2.3 Author's purpose & perspective"],
 goal:"I can identify a claim, reasons, and evidence, and judge whether the evidence is strong enough.",
 sections:[
  { key:"warm", title:"Warm-Up", icon:"🔥", min:3,
    notes:["Ask: 'What's the difference between \"I think recess is great\" and a survey result?'"],
    blocks:[
     {t:"q", id:"4w1", dok:1, type:"mc", stem:"In an argument, a claim is…", choices:["a fact anyone can check","the author's position that they try to prove","a story about the author","the opposing side"], answer:1, why:"The claim is the author's main argument — what they want you to believe or do."},
     {t:"q", id:"4w2", dok:1, type:"mc", stem:"Which of these is an example of EVIDENCE?", choices:["I think recess is great.","A survey of our school found that 8 out of 10 students want longer recess.","Recess should be longer.","Everyone loves recess!"], answer:1, why:"Evidence is information that PROVES something — like survey results, facts, statistics, or expert quotes."}
    ]},
  { key:"learn", title:"Learn It", icon:"💡", min:6,
    notes:["Build the argument 'house': claim = roof, reasons = walls, evidence = foundation.","Connect to ethos/pathos/logos from our Rhetorical Appeals tutorial."],
    blocks:[
     {t:"text", html:"🏠 Think of an argument like a <b>house</b>: the <b>claim</b> is the roof, the <b>reasons</b> are the walls, and the <b>evidence</b> is the foundation. Weak evidence = a shaky house! Tap each card."},
     {t:"cards", cards:[
      {f:"🏠 Claim", b:"The author's position. Often uses <i>should</i>, <i>must</i>, or <i>needs to</i>.<br><i>Our school should start a recycling program.</i>"},
      {f:"🧱 Reasons", b:"WHY the author believes the claim. Often start with <i>First, Second, Also</i>."},
      {f:"🔍 Evidence", b:"Proof for each reason: <b>facts</b>, <b>statistics</b>, <b>expert quotes</b>, <b>examples</b>, research."},
      {f:"⚔️ Counterclaim & Rebuttal", b:"<b>Counterclaim:</b> the other side (<i>Some people argue…</i>).<br><b>Rebuttal:</b> the author's answer (<i>However…, But…</i>)."},
      {f:"🎭 Ethos • Pathos • Logos", b:"<b>Ethos</b> = trust/credibility (experts)<br><b>Pathos</b> = emotion (strong feeling words)<br><b>Logos</b> = logic (facts, numbers, reasoning)"},
      {f:"⚖️ Relevant & Sufficient", b:"<b>Relevant:</b> the evidence connects to THAT reason.<br><b>Sufficient:</b> there is ENOUGH evidence to be convincing. One friend's opinion is not enough!"}
     ]},
     {t:"sort", id:"4s1", dok:2, prompt:"Build the argument! Tap the part of the argument each sentence is.", cats:["Claim","Reason","Evidence","Counterclaim","Rebuttal"],
      items:[
       {x:"Our school should build a student garden.", c:0},
       {x:"A garden would teach students science in a hands-on way.", c:1},
       {x:"Our science teacher says students remember lessons better when they do them with their hands.", c:2},
       {x:"Some people worry that a garden would cost too much.", c:3},
       {x:"However, local stores have offered to donate seeds and tools.", c:4}
      ], why:"Claim (should) → Reason (why) → Evidence (proof from an expert) → Counterclaim (some people) → Rebuttal (however)."},
     {t:"q", id:"4l1", dok:1, type:"mc", stem:"Checkpoint: Pathos appeals to the reader's…", choices:["emotions","logic","trust in experts","sense of time"], answer:0, why:"Pathos = emotion (think: sympathy, empathy)."}
    ]},
  { key:"model", title:"Watch Me", icon:"👀", min:5,
    notes:["Model being a 'judge' of the evidence — not just finding it."],
    blocks:[
     {t:"passage", id:"4p1", title:"Ban Homework? Not So Fast", text:`{{a|Some students believe homework should be banned completely. I disagree: homework, when it is short and meaningful, helps students succeed.}}

First, homework gives students practice. Just like a musician practices scales, students need to practice skills to remember them. {{b|Many teachers say that students who review at home are better prepared for tests.}}

Second, homework builds responsibility. Keeping track of assignments and due dates teaches skills students will use their whole lives.

{{c|Of course, too much homework can be stressful. That is why homework should be limited to about ten minutes per grade level each night — not banned altogether.}}`},
     {t:"steps", id:"4m", title:"How I judge an argument", steps:[
      {s:"Find the claim — usually at the beginning. Homework, when short and meaningful, helps students succeed.", hl:["a"]},
      {s:"Find each reason: (1) homework gives practice, (2) homework builds responsibility."},
      {s:"Judge the evidence for reason 1: 'Many teachers say…' Which teachers? How many? It's VAGUE.", hl:["b"]},
      {s:"Judge reason 2: there's NO evidence at all — only the author's explanation."},
      {s:"Find the counterclaim and rebuttal: 'too much homework can be stressful' → limit it, don't ban it.", hl:["c"]},
      {s:"My verdict: the claim is clear, but the evidence is NOT sufficient. A study or survey would make it much stronger."}
     ]},
     {t:"q", id:"4m1", dok:3, type:"mc", stem:"Checkpoint: Which evidence would BEST strengthen reason 2 (homework builds responsibility)?", choices:["Research showing that students who manage regular assignments build stronger time-management skills","Homework can be boring sometimes.","Most students like weekends better than school days.","Musicians practice scales every day."], answer:0, why:"Strong evidence is RELEVANT (it's about responsibility) and comes from research, not opinion."}
    ]},
  { key:"we", title:"Try It Together", icon:"🤝", min:6,
    notes:["Have students label each paragraph: claim, reason, evidence, counterclaim, rebuttal."],
    blocks:[
     {t:"passage", id:"4p2", title:"Recess Is Not Just for Little Kids", text:`Many middle schools have dropped recess to make more time for classes. That is a mistake. Middle school students should get at least 20 minutes of recess every day.

Recess helps students focus. The American Academy of Pediatrics has called recess a "crucial and necessary component" of a child's development and says that breaks during the day help students pay attention in class.

Recess also builds social skills. During free time, students learn to share, solve disagreements, and make new friends — skills that are hard to practice in a quiet classroom.

Some argue that middle schoolers are too old for recess. But no one is too old for a break. Even adults at work take breaks to stay productive.

Twenty minutes a day is a small price for students who are calmer, happier, and ready to learn.`},
     {t:"q", id:"4t1", dok:1, type:"mc", stem:"What is the author's claim?", choices:["Classes should be longer.","Middle school students should get at least 20 minutes of recess every day.","Adults should take more breaks.","Recess is only for young children."], answer:1, why:"Look for 'should' in the first paragraph."},
     {t:"q", id:"4t2", dok:2, type:"mc", stem:"What type of evidence supports the reason that recess helps students focus?", choices:["a personal story","an expert source","a statistic from a survey","a comparison to animals"], answer:1, why:"The American Academy of Pediatrics is a group of doctors — an expert source (ethos)."},
     {t:"q", id:"4t3", dok:2, type:"multi", pick:2, stem:"Select the TWO sentences that make up the counterclaim and rebuttal.", choices:["\"Some argue that middle schoolers are too old for recess.\"","\"Recess also builds social skills.\"","\"But no one is too old for a break.\"","\"That is a mistake.\"","\"Recess helps students focus.\""], answer:[0,2], why:"'Some argue…' = counterclaim. 'But…' = the author's rebuttal."}
    ]},
  { key:"challenge", title:"Challenge", icon:"🧗", min:3,
    notes:["Ask: 'If you were the author, what evidence would you ADD?'"],
    blocks:[
     {t:"passage", ref:"4p2"},
     {t:"q", id:"4c1", dok:3, type:"mc", stem:"Which reason is supported with the LEAST evidence?", choices:["Recess helps students focus.","Recess builds social skills.","Middle schools have dropped recess.","Adults take breaks at work."], answer:1, why:"The social skills paragraph only explains — no expert, study, or numbers. The focus reason has an expert source."},
     {t:"q", id:"4c2", dok:3, type:"ab",
      a:{stem:"Part A: Why does the author compare students to adults at work?", choices:["to show that breaks help everyone stay productive, which answers the counterclaim","to argue that students should get jobs","to prove that adults need recess","to describe what adults do at work"], answer:0},
      b:{stem:"Part B: Which sentence BEST supports the answer to Part A?", choices:["\"Even adults at work take breaks to stay productive.\"","\"Many middle schools have dropped recess\"","\"students learn to share, solve disagreements, and make new friends\"","\"Twenty minutes a day is a small price\""], answer:0},
      why:"The comparison is logical reasoning (logos): if breaks help adults, they help students too — so no one is 'too old.'"}
    ]},
  { key:"exit", title:"Exit Key", icon:"🔑", min:2, exit:true,
    notes:["Independent. Screenshot the box for Canvas."],
    blocks:[
     {t:"q", id:"4x1", dok:1, type:"mc", stem:"A counterclaim is…", choices:["the author's main claim","the opposing side's argument","a piece of evidence","the conclusion"], answer:1, why:"Counter = against. It's the other side."},
     {t:"q", id:"4x2", dok:2, type:"mc", stem:"Claim: \"Our school should have a longer lunch period.\" Which evidence is MOST relevant?", choices:["Pizza is the most popular lunch.","In a class survey, 1 in 3 students said they don't have time to finish eating.","The cafeteria was painted blue last year.","Some students bring their lunch from home."], answer:1, why:"Only the survey connects directly to WHY lunch should be longer."},
     {t:"q", id:"4x3", dok:3, type:"mc", stem:"Two pieces of evidence support the claim \"Schools should start later.\" A: \"My friend is always tired in first period.\" B: \"A study of more than 9,000 high school students found that later start times improved attendance.\" Which is stronger, and why?", choices:["B, because it is based on research with many students, not one person's experience","A, because it is a real example from a friend","A, because it is shorter","B, because it uses a big number to scare readers"], answer:0, why:"Research with thousands of students is more sufficient and reliable than one person's story."}
    ]}
 ]};

     {t:"q", id:"5w2", dok:1, type:"mc", stem:"Personification gives ________ to non-human things.", choices:["colors","human qualities or actions","numbers","rhymes"], answer:1, why:"Person-ification = making something act like a PERSON."}

      {f:"🎈 Hyperbole", b:"A huge exaggeration for emphasis.<br><i>I have a ton of homework.</i> → I have a LOT."},

      {s:"Text 2 uses facts: where lightning strikes most, why storms form, and safety advice."},
      {s:"Look for the overlap: the poem says the storm 'moves on' quickly; the article says storms 'build fast and end quickly.'", hl:["d","c"]},
      {s:"Shared idea: Florida storms are powerful but pass quickly. Difference: the poem creates a MOOD; the article INFORMS. ✔"}
     ]},

  { key:"r3", title:"Room 3: PM2 Simulator", icon:"🎯", min:12, blocks:[
    {t:"passage", id:"Q1p2", title:"The Glow of the Deep", text:`Far below the ocean's surface, where sunlight cannot reach, the water is pitch black. Yet this dark abyss is not completely without light. Many creatures that live there produce their own glow, a process called bioluminescence.

The word comes from two parts: bio, meaning "life," and lumin, meaning "light." Bioluminescence is light made by living things. Animals create it through a chemical reaction inside their bodies.

Deep-sea animals use their light in clever ways. The anglerfish dangles a glowing lure in front of its mouth. Curious fish swim toward the light — and right into the anglerfish's jaws. Other creatures use light for defense. Some squid release a cloud of glowing ink to confuse a predator, an animal that hunts others for food, while they make a quick escape.

Light can even help animals hide. Some fish have glowing undersides that match the faint light filtering down from above. Predators looking up from below cannot see their outline. This kind of disguise is called counter-illumination.

Scientists are still discovering new glowing species. Each discovery shows how life can adapt, or change to survive, even in the most extreme places on Earth.`},

  { key:"r2", title:"Room 2: Passage Practice", icon:"📖", min:10, blocks:[
    {t:"passage", id:"Q2p1", title:"The Table Near the Trash Cans", text:`On his first day at Riverside Middle, Omar carried his lunch tray around the cafeteria twice. Every table seemed full of kids who already knew each other. He finally sat alone near the trash cans and pretended to read a book.

At the next table, Bella noticed. She remembered her own first day last year, when no one had saved her a seat. She also knew her friends might tease her if she left. For a moment she stayed where she was, staring at her sandwich.

Then she picked up her tray. "Is this seat taken?" she asked.

Omar looked up, surprised. "No. I mean — sure."

They discovered they both loved drawing comics. By the end of lunch, Bella had sketched a superhero version of Omar, complete with a cape made of cafeteria napkins. He laughed so hard that milk nearly came out of his nose.

The next day, two of Bella's friends wandered over to see the comics. By Friday, the table near the trash cans was the most crowded one in the cafeteria.`},

    {t:"q", id:"Q2f", dok:2, type:"mc", stem:"Why does Bella decide to sit with Omar?", choices:["She remembers how it felt to be alone on her first day.","Her teacher told her to.","She wants to borrow his book.","Her friends asked her to."], answer:0, why:"Motivation = WHY. 'She remembered her own first day last year, when no one had saved her a seat.'"},
    {t:"q", id:"Q2g", dok:2, type:"mc", stem:"Which event is the turning point of the story?", choices:["Bella picks up her tray and asks to sit with Omar.","Omar carries his tray around twice.","Bella draws a superhero.","Two friends come over the next day."], answer:0, why:"Everything changes when Bella makes her choice. After that, Omar is no longer alone."},
    {t:"q", id:"Q2h", dok:2, type:"multi", pick:2, stem:"Select the TWO details that show how Omar feels at the BEGINNING of the story.", choices:["\"carried his lunch tray around the cafeteria twice\"","\"He laughed so hard that milk nearly came out of his nose.\"","\"sat alone near the trash cans and pretended to read a book\"","\"They discovered they both loved drawing comics.\"","\"two of Bella's friends wandered over\""], answer:[0,2], why:"Wandering twice and pretending to read show he feels lonely and out of place."},

  { key:"r3", title:"Room 3: PM2 Simulator", icon:"🎯", min:12, blocks:[
    {t:"passage", id:"Q2p2", poem:true, title:"My Grandmother's Hands (a poem)", text:`My grandmother's hands are maps
of every road she's traveled —
lines from years of kneading bread,
a scar from the fence she mended
the winter Grandpa was sick.

They are slow now.
They shake a little
when she threads a needle,
so I thread it for her,
and she guides my fingers
through the stitches
the way her mother guided hers.

Someday my hands
will be maps, too.
I hope they show
the same roads.`},

    {t:"q", id:"Q2k", dok:3, type:"mc", stem:"Why is the poem divided into three stanzas?", choices:["The stanzas move from the grandmother's past, to the present, to the speaker's future.","Each stanza describes a different grandmother.","The stanzas show three different seasons.","Each stanza rhymes in a different way."], answer:0, why:"Stanza 1 = what her hands did. Stanza 2 = now. Stanza 3 = 'Someday.' Structure supports meaning."},
    {t:"q", id:"Q2l", dok:2, type:"mc", stem:"How does the speaker's role change in stanza 2?", choices:["The speaker goes from describing her hands to helping her and learning from her.","The speaker stops visiting the grandmother.","The speaker teaches the grandmother to read.","The speaker becomes angry."], answer:0, why:"'I thread it for her' and 'she guides my fingers' show the speaker helping AND learning."},
    {t:"q", id:"Q2m", dok:3, type:"ab",
     a:{stem:"Part A: Which statement BEST expresses a theme of the poem?", choices:["Skills and values are passed down from one generation to the next.","Sewing is difficult to learn.","Old age makes people sad.","Maps help people find their way."], answer:0},
     b:{stem:"Part B: Which lines BEST support the answer to Part A?", choices:["\"she guides my fingers / through the stitches / the way her mother guided hers\"","\"They are slow now.\"","\"lines from years of kneading bread\"","\"a scar from the fence she mended\""], answer:0},

    {t:"q", id:"Q2n", dok:3, type:"mc", stem:"What do the final lines, \"I hope they show / the same roads,\" suggest about the speaker?", choices:["The speaker hopes to live a life of hard work and caring, like her grandmother.","The speaker wants to travel the same highways.","The speaker is worried about getting hurt.","The speaker does not want to grow old."], answer:0, why:"The 'roads' are the grandmother's life of work and love. The speaker admires it and wants the same."}

    {t:"q", id:"Q3a", dok:1, type:"mc", mini:"Honey can last for thousands of years. Archaeologists have found pots of honey in ancient Egyptian tombs that were still safe to eat. Honey has very little water, so bacteria can't grow in it. It is also slightly acidic, which helps it stay fresh.", stem:"Which sentence states the central idea?", choices:["Honey can last for thousands of years.","Honey has very little water, so bacteria can't grow in it.","It is also slightly acidic.","Archaeologists have found pots of honey in ancient Egyptian tombs."], answer:0, why:"The first sentence is the umbrella; the other sentences are details that explain or prove it."},

  { key:"r2", title:"Room 2: Passage Practice", icon:"📖", min:10, blocks:[
    {t:"passage", id:"Q3p1", title:"Gator or Croc?", text:`Florida is the only place in the world where alligators and crocodiles live side by side. At first glance, the two reptiles look almost the same. Both have thick, scaly skin, powerful tails, and rows of sharp teeth. Both are cold-blooded, which means they rely on the sun to warm their bodies.

However, there are clear differences if you know where to look. An alligator has a wide, U-shaped snout, while a crocodile's snout is narrow and V-shaped. When an alligator closes its mouth, its lower teeth are mostly hidden. When a crocodile closes its mouth, a large tooth on each side of its lower jaw still sticks out.

Their color is different, too. Alligators are usually dark, almost black, while crocodiles are lighter, often a grayish-green.

The two also prefer different homes. Alligators live mostly in freshwater, such as swamps, lakes, and rivers. American crocodiles, which are much rarer in Florida, prefer the salty or brackish water along the southern coast and in the Florida Keys.

So the next time you spot a reptile sunning itself on a Florida riverbank, look closely — it might be the one you least expect.`},

    {t:"q", id:"Q3f", dok:2, type:"multi", pick:2, stem:"Select the TWO signal words from the passage that show CONTRAST.", choices:["However","Both","while","too","So"], answer:[0,2], why:"However and while show differences. Both shows how they're alike."},
    {t:"q", id:"Q3g", dok:2, type:"mc", stem:"Which statement BEST expresses the central idea?", choices:["Alligators and crocodiles look alike, but they differ in snout shape, teeth, color, and habitat.","Alligators are dark, almost black.","Florida has many reptiles.","Crocodiles live in the Florida Keys."], answer:0, why:"The umbrella covers the similarities AND all the differences in paragraphs 2–4."},
    {t:"q", id:"Q3h", dok:2, type:"mc", stem:"How does paragraph 1 contribute to the article?", choices:["It explains how the two reptiles are alike before the article explains how they are different.","It tells where to buy a pet alligator.","It argues that crocodiles are more dangerous.","It describes the history of Florida."], answer:0, why:"Paragraph 1 = similarities (Both… Both…). The rest = differences."},

  { key:"r3", title:"Room 3: PM2 Simulator", icon:"🎯", min:12, blocks:[
    {t:"passage", id:"Q3p2", title:"The Day the Lights Went Out", text:`## A Hot Afternoon
On August 14, 2003, power lines in Ohio sagged in the summer heat. As electricity flowed through them, the wires warmed and stretched, drooping lower than usual. Some touched trees that had not been trimmed. Each time a line touched a tree, it shut down.

## A Chain Reaction
Normally, an alarm system would have warned workers about the problem. But a computer error caused the alarm to fail, so workers did not realize lines were shutting down. As each line failed, the electricity it carried was pushed onto other lines. Those lines became overloaded and shut down, too. Within minutes, the failures spread like falling dominoes across the region.

## Darkness Spreads
By late afternoon, about 50 million people in the northeastern United States and parts of Canada had lost power. Subways stopped in tunnels. Traffic lights went dark. In New York City, thousands of people walked home across bridges because trains were not running.

## Lessons Learned
After the blackout, power companies changed their rules. They now must trim trees near power lines regularly, and their warning systems are checked more carefully. These changes were made so that one small problem cannot cause such a large failure again.`},

    {t:"q", id:"Q3k", dok:3, type:"ab",

     b:{stem:"Part B: Which sentence BEST supports the answer to Part A?", choices:["\"But a computer error caused the alarm to fail, so workers did not realize lines were shutting down.\"","\"Traffic lights went dark.\"","\"Some touched trees that had not been trimmed.\"","\"They now must trim trees near power lines regularly\""], answer:0},
     why:"Trees started it, but the failed alarm let it SPREAD — no one knew to stop it."},
    {t:"q", id:"Q3l", dok:2, type:"mc", stem:"How does the simile \"spread like falling dominoes\" help explain the blackout?", choices:["It shows that each failure caused the next one in a chain.","It shows that the power lines were made of wood.","It shows that people were playing games during the blackout.","It shows that the blackout happened slowly."], answer:0, why:"When one domino falls, it knocks over the next — just like overloaded lines."},
    {t:"q", id:"Q3m", dok:2, type:"mc", stem:"How do the headings help the reader?", choices:["They show the order of events from the cause, to the effects, to the solution.","They list the people who lost power.","They give the author's opinion.","They define difficult words."], answer:0, why:"Headings act as a map of the structure: start → chain reaction → results → solutions."},
    {t:"q", id:"Q3n", dok:3, type:"mc", stem:"Which is the BEST summary of the article?", choices:["In 2003, sagging power lines touched trees in Ohio, and a failed alarm let the problem spread, causing a blackout for 50 million people. Afterward, power companies changed their rules.","Subways stopped and people walked home in New York City.","Power companies should trim their trees.","The blackout was scary and probably the worst day ever."], answer:0, why:"A strong summary covers the whole text — cause, effects, and solution — without opinions."}
  ]},

  { key:"r2", title:"Room 2: Passage Practice", icon:"📖", min:10, blocks:[
    {t:"passage", id:"Q4p1", title:"Zoos Can Save Species", text:`Some people believe zoos should be shut down. I disagree. Modern, well-run zoos play an important role in protecting animals and teaching people to care about them.

First, zoos help save endangered species. Many zoos run breeding programs for animals that are disappearing in the wild. The California condor, for example, dropped to just 27 birds in the 1980s. Zoos raised condor chicks and released them into the wild, and today there are more than 500 condors.

Second, zoos teach visitors about wildlife. Seeing a real elephant or tiger up close can inspire a child to care about nature in a way a book or video cannot.

Critics argue that animals in zoos are unhappy because they live in small spaces. This concern is fair for poorly run zoos. However, accredited zoos must meet strict standards for space, care, and enrichment, such as toys and puzzles that keep animals active.

Zoos are not perfect, but the best ones give endangered animals a future. Instead of closing zoos, we should support the ones that do it right.`},

  { key:"r3", title:"Room 3: PM2 Simulator", icon:"🎯", min:12, blocks:[
    {t:"passage", id:"Q4p2", title:"Text 1: Put Phones Away (by a teacher)", text:`Our school should ban phones during the school day. Phones are a constant distraction. In my classroom, I see students sneak glances at their screens, even during tests.

Research supports this. A study by the London School of Economics found that test scores improved at schools that banned phones, especially for students who were struggling.

Some parents worry they won't be able to reach their children in an emergency. However, the front office can always contact families quickly. Learning should come first.`},
    {t:"passage", id:"Q4p3", title:"Text 2: Phones Can Be Tools (by a student)", text:`Banning phones is not the answer. Phones can be powerful learning tools when teachers use them wisely. In my science class, we use our phones to record experiments and look up facts.

Phones also help students stay organized with calendars and reminders. And many families feel safer knowing they can reach their kids directly.

Instead of a ban, schools should teach students to use phones responsibly — a skill we will need for the rest of our lives.`},
    {t:"q", id:"Q4j", dok:1, type:"mc", stem:"What is the claim in Text 2?", choices:["Schools should teach students to use phones responsibly instead of banning them.","Phones should be banned.","Science class is the best class.","Parents should not call students."], answer:0, why:"Look at the first and last sentences of Text 2."},

    {t:"passage", id:"Q5p1", poem:true, title:"The Old Oak (a poem)", text:`The old oak stands at the edge of the field,
a giant with arms spread wide,
holding up the sky like a tired king
who has nowhere left to hide.

in summer it shades the cows,

    {t:"passage", id:"Q5p2", title:"The Life of an Oak (an article)", text:`Oak trees can live for hundreds of years — some for more than 1,000. Each year, a tree adds a new layer of wood under its bark, forming a ring. By counting these rings, scientists can tell a tree's age. Wide rings show years with plenty of rain; narrow rings show dry years. The science of studying tree rings is called dendrochronology.

In autumn, oaks drop their leaves to save water and energy during winter, when the ground may freeze. A single large oak can produce thousands of acorns in a good year, feeding deer, squirrels, and birds. Oaks also provide homes for hundreds of kinds of insects — more than almost any other tree in North America.`},

    {t:"q", id:"Q5m", dok:2, type:"mc", stem:"How is the poem's description of autumn DIFFERENT from the article's?", choices:["The poem calls the leaves 'golden coins' to show beauty; the article explains that oaks drop leaves to save water and energy.","Both describe autumn using only facts.","The article uses figurative language, but the poem does not.","The poem says leaves fall in spring."], answer:0, why:"Same event, different purpose: the poem creates an image; the article explains why."},

  { key:"r2", title:"Room 2: Literary Passage", icon:"📖", min:10, blocks:[
    {t:"passage", id:"Q6p1", title:"The Recital", text:`Jade's fingers hovered over the piano keys. Two hundred faces stared up at the stage, and the silence in the auditorium was so heavy she could almost hear it breathing.

She had practiced the sonata every day for three months. Her teacher, Mr. Alvarez, had told her that the hardest part would not be the notes — it would be trusting herself.

Jade began. The first page flowed like water. Then, in the middle of the second page, her mind went blank. Her hands froze. Somewhere in the audience, someone coughed.

Jade closed her eyes and took a slow, deep breath. She stopped trying to remember the notes and instead listened to the music in her head, the way she did when she played alone in her living room. Slowly, her fingers found their way back.

When the final chord faded, the audience rose to its feet. Jade bowed, her knees still trembling. Backstage, Mr. Alvarez handed her a water bottle and smiled. "You didn't play it perfectly," he said. "You played it bravely. That's harder."`},

  { key:"r3", title:"Room 3: Informational Passage", icon:"🎯", min:12, blocks:[
    {t:"passage", id:"Q6p2", title:"Why Do We Get Nervous?", text:`Have you ever felt your heart pound before a big test or performance? That feeling is caused by your body's stress response, sometimes called "fight or flight."

When your brain senses a challenge, it signals your body to release a hormone called adrenaline. Adrenaline makes your heart beat faster, sends more blood to your muscles, and sharpens your senses. Long ago, this response helped humans escape danger, such as a charging animal.

Today, most challenges are not dangerous, but your body reacts the same way. That is why you might feel shaky, sweaty, or have "butterflies" in your stomach before a test.

The good news is that a little stress can actually help. A moderate amount of stress can improve focus and performance. The key is keeping it from becoming too much.

Simple strategies can calm the stress response. Taking slow, deep breaths signals your brain that you are safe. Getting enough sleep and eating a healthy breakfast also help your body handle stress. Some students find it helpful to picture themselves succeeding before they begin.`},
